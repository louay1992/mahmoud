<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>كابتن التوصيل</title>
<link rel="manifest" href="/manifest-captain.json">
<link rel="icon" href="/icons/captain-192.png">
<link rel="apple-touch-icon" href="/icons/captain-apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --p:#2563eb;--p2:#1e3a8a;--p3:#3b82f6;--bg:#eef2f9;--card:#fff;--bd:#e3e9f3;--tx:#0f172a;--mut:#64748b;
  --red:#ef4444;--grn:#16a34a;--amb:#f59e0b;--org:#ea580c;--cy:#0891b2;--sl:#475569;
  --r:16px;--sh:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(30,58,138,.07);
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:16px;line-height:1.5;overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.22em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(37,99,235,.45);outline-offset:2px}

/* شاشة البداية */
#splash{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#1e3a8a,#2563eb 60%,#60a5fa);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;transition:opacity .4s,visibility .4s}
#splash.off{opacity:0;visibility:hidden}
#splash .logo{width:92px;height:92px;border-radius:26px;background:rgba(255,255,255,.16);display:grid;place-items:center;animation:float 2.4s ease-in-out infinite;backdrop-filter:blur(6px)}
#splash .logo svg{width:52px;height:52px;stroke:#fff}
#splash b{font-size:22px;letter-spacing:.3px}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-8px)}}

/* الدخول */
#login{min-height:100vh;min-height:100dvh;display:none;flex-direction:column;background:linear-gradient(165deg,#1e3a8a 0%,#2563eb 55%,#60a5fa 100%)}
#login .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:calc(var(--top) + 30px) 20px 10px;text-align:center}
#login .hero svg.truck{width:min(62vw,250px);height:auto;animation:drive 3.2s ease-in-out infinite}
@keyframes drive{0%,100%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
#login .hero h1{margin:14px 0 4px;font-size:28px}
#login .hero p{margin:0;opacity:.85}
#login .panel{background:#fff;border-radius:28px 28px 0 0;padding:24px 20px calc(24px + var(--bot));box-shadow:0 -10px 40px rgba(0,0,0,.18);animation:sheet .5s cubic-bezier(.2,.9,.3,1) both}
#login .panel .in{max-width:420px;margin:0 auto}
.fld{position:relative;margin-bottom:12px}
.fld input{width:100%;padding:15px 14px;padding-inline-start:46px;border:1.5px solid var(--bd);border-radius:14px;font:inherit;background:#f8fafd;transition:border .2s,box-shadow .2s,background .2s}
.fld input:focus{outline:none;border-color:var(--p);background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.fld>span{position:absolute;inset-inline-start:15px;top:50%;transform:translateY(-50%);color:var(--mut);display:flex;pointer-events:none}
.fld .eye{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);border:0;background:none;padding:8px;color:var(--mut);cursor:pointer}
.fld .eye+input,.fld:has(.eye) input{padding-inline-end:46px}

/* الهيدر */
header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#1e3a8a,#2563eb 70%,#3b82f6);color:#fff;padding:calc(var(--top) + 12px) 14px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(30,58,138,.28);border-radius:0 0 22px 22px}
header .av{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-size:19px;flex:none}
header .tt{flex:1;min-width:0}
header .tt b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .tt span{display:block;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:13px;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer;position:relative;transition:transform .15s,background .2s}
.ib:active{transform:scale(.9);background:rgba(255,255,255,.28)}
.ib .dot{position:absolute;top:8px;inset-inline-end:9px;width:9px;height:9px;border-radius:50%;background:#fbbf24;border:2px solid #2563eb}
.ib.on .dot{background:#4ade80}
.ib.sp svg{animation:rot .8s linear infinite}

main{max-width:760px;margin:0 auto;padding:16px 14px calc(96px + var(--bot))}
#bar{position:fixed;top:0;inset-inline:0;height:3px;z-index:99;background:linear-gradient(90deg,transparent,#fbbf24,transparent);background-size:50% 100%;background-repeat:no-repeat;opacity:0;transition:opacity .2s}
#bar.on{opacity:1;animation:bar 1s linear infinite}
@keyframes bar{from{background-position:-50% 0}to{background-position:150% 0}}
#ptr{position:fixed;top:calc(var(--top) + 70px);left:50%;margin-left:-20px;width:40px;height:40px;border-radius:50%;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;color:var(--p);z-index:40;transform:translateY(-120px);transition:transform .2s}
#ptr.ready{color:var(--grn)}#ptr.spin svg{animation:rot .8s linear infinite}

/* شريط التنقل السفلي */
nav{position:fixed;bottom:0;inset-inline:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:6px 8px calc(6px + var(--bot));box-shadow:0 -6px 24px rgba(15,23,42,.06)}
nav .row{display:flex;width:100%;max-width:520px;gap:4px}
nav button{flex:1;border:0;background:none;padding:7px 4px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:12px;font-weight:600;cursor:pointer;position:relative;transition:color .2s,background .2s,transform .15s}
nav button svg.i{width:24px;height:24px;transition:transform .25s}
nav button.on{color:var(--p);background:#eaf1ff}
nav button.on svg.i{transform:translateY(-2px) scale(1.12)}
nav button:active{transform:scale(.94)}
nav .bd{position:absolute;top:2px;inset-inline-end:calc(50% - 26px);min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;animation:pop .35s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}

/* الأزرار */
.btn{border:0;border-radius:14px;padding:0 16px;min-height:48px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,box-shadow .2s,filter .2s;position:relative;overflow:hidden;text-decoration:none;font-size:15.5px}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-p{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.32)}
.btn-g{background:linear-gradient(135deg,#16a34a,#22c55e);color:#fff;box-shadow:0 6px 16px rgba(22,163,74,.3)}
.btn-r{background:linear-gradient(135deg,#dc2626,#ef4444);color:#fff;box-shadow:0 6px 16px rgba(220,38,38,.28)}
.btn-o{background:#fff;color:var(--p);border:1.5px solid #c7d7fb}
.btn-t{background:#eef3ff;color:var(--p)}
.btn-sm{min-height:40px;font-size:14px;padding:0 12px;border-radius:12px}
.btn-block{width:100%}
.btn.load::after{content:"";width:18px;height:18px;border:2.5px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}

/* البطاقات */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid rgba(227,233,243,.7)}
.card h2{font-size:16.5px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.anim .card,.anim .tile,.anim .grp,.anim .stat{animation:up .45s cubic-bezier(.2,.8,.3,1) both}
.anim .tile:nth-child(2),.anim .stat:nth-child(2){animation-delay:.04s}.anim .tile:nth-child(3),.anim .stat:nth-child(3){animation-delay:.08s}
.anim .tile:nth-child(4),.anim .stat:nth-child(4){animation-delay:.12s}.anim .tile:nth-child(5){animation-delay:.16s}.anim .tile:nth-child(6){animation-delay:.2s}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes zoom{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:none}}


.sbar{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -4px;scrollbar-width:none}.sbar::-webkit-scrollbar{display:none}
.sch{flex:0 0 auto;display:flex;align-items:center;gap:7px;border:0;background:#fff;box-shadow:var(--sh);border-radius:24px;padding:9px 14px;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer;color:#334155;transition:transform .12s}
.sch:active{transform:scale(.95)}.sch .n{background:#eef2f7;border-radius:12px;padding:0 9px;font-size:13px;min-width:24px;text-align:center}
.sch.on{background:var(--c);color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.18)}.sch.on .n{background:rgba(255,255,255,.28);color:#fff}
.sch.hot:not(.on) .n{background:#f59e0b;color:#fff;animation:pulse 1.8s infinite}
.olist{display:grid;gap:12px}
@media(min-width:760px){.olist{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}}
.oc2{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:14px;border-inline-start:5px solid var(--sc,#94a3b8);animation:up .35s both}
.oc2 .r1{display:flex;align-items:flex-start;gap:10px}
.oc2 .no{background:#eef3ff;color:var(--p);font-weight:800;border-radius:10px;padding:4px 9px;font-size:13px}
.oc2 .nm{flex:1;min-width:0}.oc2 .nm b{display:block;font-size:17px;line-height:1.3}.oc2 .nm span{font-size:12.5px;color:var(--mut)}
.oc2 .amt{font-size:21px;font-weight:800;white-space:nowrap;text-align:end;line-height:1.1}.oc2 .amt small{display:block;font-size:11.5px;color:var(--mut);font-weight:600}
.oc2 .ln{display:flex;gap:8px;align-items:flex-start;margin-top:9px;font-size:14.5px;line-height:1.5;color:#334155}.oc2 .ln svg{flex:0 0 auto;margin-top:3px;color:#94a3b8}
.oc2 .ln.ad{font-weight:700;color:#0f172a}.oc2 .ln.ad svg{color:#ef4444}
.oc2 .flag{display:flex;gap:8px;align-items:flex-start;margin-top:9px;border-radius:12px;padding:8px 10px;font-size:13.5px;background:#fff7e0;color:#7a4b00}.oc2 .flag.a{background:#eef3ff;color:#1e3a8a}
.oc2 .bar{display:flex;gap:8px;margin-top:12px;align-items:stretch;flex-wrap:wrap}.oc2 .bar .ac{flex:1 1 200px;display:flex;gap:8px;min-width:0}.oc2 .bar .ic{display:flex;gap:8px;flex:1 1 100%;flex-wrap:wrap}
.oc2 .bar .btn{flex:1 1 0;min-width:0;min-height:50px;font-size:15px;white-space:nowrap;padding:0 8px}
.oc2 .ib{flex:1;min-height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 8px;border:0;cursor:pointer;text-decoration:none}
.oc2 .ib.c{background:#e3f8ea;color:#15803d}.oc2 .ib.w{background:#25D366;color:#fff;box-shadow:0 4px 12px rgba(37,211,102,.35)}.oc2 .ib.m{background:#e8f0ff;color:#1d4ed8}.oc2 .ib span{font-size:14px;font-weight:800}.oc2 .ib.d{background:#f1f5f9;color:#475569;font-weight:800;font-size:13px}
.oc2 .r1{align-items:flex-start}.oc2 .nm b{font-size:18px}
.oc2 .info{margin-top:10px;background:#f7f9fd;border-radius:14px;padding:10px 12px;display:grid;gap:8px}
.oc2 .ph{display:flex;gap:8px;align-items:center;font-weight:800;font-size:17px;color:#15803d;text-decoration:none}
.oc2 .ad{display:flex;gap:8px;align-items:flex-start;font-weight:600;line-height:1.55}.oc2 .ad svg{flex:0 0 auto;margin-top:4px;color:#ef4444}
.oc2 .prods{margin-top:10px;border:1px solid var(--bd,#e5eaf3);border-radius:14px;padding:4px 12px}
.oc2 .pi{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bd,#e5eaf3)}
.oc2 .pi .q{background:#eef3ff;color:var(--p);font-weight:800;border-radius:8px;padding:1px 8px;font-size:13px}.oc2 .pi .pn{flex:1;font-weight:600}.oc2 .pi .pv{font-weight:700;white-space:nowrap}
.oc2 .sum{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 0 6px;font-size:13px;color:var(--mut);flex-wrap:wrap}.oc2 .sum .tt{font-size:15px;color:#0f172a}.oc2 .sum .tt b{font-size:20px}
.oc2 .ib.d{flex:1 1 100%;font-size:14px;gap:6px}
.dsec{background:#f7f9fd;border-radius:14px;padding:12px 14px;margin:10px 0}.dsec .dh{font-weight:800;color:var(--p);margin-bottom:6px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tile{border:0;background:var(--card);border-radius:var(--r);padding:12px 4px;text-align:center;cursor:pointer;box-shadow:var(--sh);transition:transform .15s;position:relative;overflow:hidden}
.tile:active{transform:scale(.94)}
.tile .ico{width:38px;height:38px;border-radius:12px;margin:0 auto 6px;display:grid;place-items:center;color:#fff}
.tile .c{font-size:22px;font-weight:800;line-height:1.15}
.tile .l{font-size:12px;color:var(--mut);font-weight:600}
.tile.z{opacity:.5}
.tile.hot{box-shadow:0 0 0 2px var(--amb),var(--sh)}
.tile.hot .ico{animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(245,158,11,.5)}70%{box-shadow:0 0 0 10px rgba(245,158,11,0)}100%{box-shadow:0 0 0 0 rgba(245,158,11,0)}}

.search{position:relative;flex:1}
.search input{width:100%;padding:13px 14px;padding-inline-start:44px;border:1.5px solid var(--bd);border-radius:14px;font:inherit;background:#fff;box-shadow:var(--sh)}
.search input:focus{outline:none;border-color:var(--p);box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.search svg.i{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--mut)}
textarea,select,input.tx{width:100%;padding:13px;border:1.5px solid var(--bd);border-radius:14px;font:inherit;margin-bottom:10px;background:#f8fafd}
textarea:focus,select:focus,input.tx:focus{outline:none;border-color:var(--p);background:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.12)}

.grp{background:transparent;margin-bottom:14px;scroll-margin-top:96px}
.grp>summary{padding:6px 4px 10px;cursor:pointer;font-weight:800;display:flex;align-items:center;gap:10px;list-style:none;font-size:16.5px}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .gi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff}
.grp>summary .n{margin-inline-start:auto;background:#fff;box-shadow:var(--sh);border-radius:12px;padding:1px 12px;font-size:14px}
.grp>summary .chev{transition:transform .25s;color:var(--mut)}
.grp[open]>summary .chev{transform:rotate(180deg)}
.grp .hint{padding:0 4px 10px;color:var(--mut);font-size:13.5px}
.inner{display:grid;gap:12px}
.empty{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 10px;color:var(--mut);text-align:center;background:#fff;border-radius:var(--r);box-shadow:var(--sh)}
.empty svg{width:76px;height:76px;opacity:.9}

.oc{margin:0;position:relative;padding:14px;border-inline-start:5px solid var(--sc,#94a3b8);animation:up .4s both}
.oc-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.oc-h .no{background:#eef3ff;color:var(--p);font-weight:800;border-radius:11px;padding:6px 10px;font-size:14px}
.oc-h .who{flex:1;min-width:0}
.oc-h .who b{display:block;font-size:16.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mut{color:var(--mut);font-size:13.5px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:20px;font-size:12.5px;font-weight:700;color:#fff;background:var(--sc,#64748b);white-space:nowrap}
.call{display:flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#eaf6ee,#e1f3e8);color:#15803d;font-weight:800;text-decoration:none;border-radius:13px;padding:11px;margin-bottom:10px;font-size:17px;transition:transform .12s}
.call:active{transform:scale(.97)}
.qa{display:flex;gap:8px;margin-bottom:10px}
.qb{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:13px;padding:11px;font-weight:800;text-decoration:none;transition:transform .12s}
.qb:active{transform:scale(.96)}.qb.wa{background:#25D366;color:#fff}.qb.mp{background:#e8f0ff;color:#1d4ed8}
.addr{display:flex;gap:8px;align-items:flex-start;margin:-2px 2px 10px;font-weight:600;line-height:1.6}.addr svg{margin-top:5px;color:#ef4444}
.items{background:#f7f9fd;border-radius:13px;padding:6px 12px;margin-bottom:10px}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--bd)}
.it:last-child{border:0}
.it .q{background:#fff;border:1px solid var(--bd);border-radius:9px;padding:1px 8px;font-weight:800;font-size:13px;color:var(--p)}
.it .nm{flex:1;font-weight:600}
.it .pr{font-weight:700;white-space:nowrap}
.it small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.tot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 2px 8px}
.tot .amt{font-size:22px;font-weight:800;color:var(--tx)}
.note{margin:6px 0;padding:10px 12px;border-radius:12px;background:#fff8eb;border:1px solid #fde4b3;font-size:14px;display:flex;gap:8px}
.note.adm{background:#eef4ff;border-color:#c9dbff}
.note svg{margin-top:3px}
.tl{margin:8px 0;font-size:13px;color:var(--mut)}.tl summary{cursor:pointer;font-weight:600}
.tl div{padding:5px 0;border-top:1px dashed var(--bd)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts .btn{flex:1 1 120px}
.acts2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts2 .btn{flex:1 1 auto}
.pr-box{margin-top:8px;border-radius:12px;padding:10px 12px;font-size:13.5px}

.s-new,.s-assigned{--sc:#f59e0b}.s-in_delivery{--sc:#2563eb}.s-no_answer{--sc:#ea580c}.s-closed{--sc:#475569}.s-other{--sc:#0891b2}.s-delivered{--sc:#16a34a}.s-cancelled{--sc:#ef4444}.s-returned{--sc:#7c3aed}

/* النوافذ */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:60;animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + var(--bot));max-height:92vh;max-height:92dvh;overflow:auto;animation:sheet .35s cubic-bezier(.2,.9,.3,1)}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:#d5dbe7;margin:0 auto 12px}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:17px}
.x{border:0;background:#f1f5f9;border-radius:50%;width:38px;height:38px;cursor:pointer;display:grid;place-items:center;transition:transform .15s}
.x:active{transform:scale(.88)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.opt{display:flex;align-items:center;gap:10px;padding:14px 12px;border:2px solid var(--bd);border-radius:15px;background:#fff;cursor:pointer;text-align:start;font-weight:600;transition:transform .12s,border .2s,background .2s}
.opt:active{transform:scale(.96)}
.opt .oi{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;color:#fff;background:var(--sc)}

  const cur={o:{},p:D.payments.map(x=>x.id),r:{}};

    D.orders.forEach(o=>{ const b=S.o[o.id]; if(!b) return;

    g.gain.setValueAtTime(.0001,t+d); g.gain.exponentialRampToValueAtTime(.3,t+d+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d+.3); o.start(t+d); o.stop(t+d+.32) }) }catch(e){} }

const b64u8=b=>{ const p="=".repeat((4-b.length%4)%4), r=atob((b+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from([...r].map(c=>c.charCodeAt(0))) };

      sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u8(key)}) }
    const j=sub.toJSON(); await sb.rpc("save_push_subscription",{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth});
  }catch(e){ console.warn("push",e) }

  $("main").innerHTML = `${nb?`<div class="banner n">${ic("bell")}<div><b>فعّل الإشعارات</b><span>لتصلك الطلبات الجديدة وملاحظات الإداري فوراً</span></div><button class="btn" onclick="bellClick().then(()=>render())">تفعيل</button></div>`:""}
  <div class="sbar" id="sbar">${SBAR.map(([k,l])=>{const n=cnt(k);return `<button class="sch ${TF===k?"on":""} ${n&&(k==="assigned"||k==="no_answer")?"hot":""}" style="--c:${SCOL[k]}" onclick="TF='${k}';vOrders();scrollTo({top:0})">${l}<span class="n">${n}</span></button>`}).join("")}</div>
  <div class="search" style="margin-bottom:12px">${ic("search")}<input id="oq" placeholder="بحث بالاسم أو الموبايل أو الرقم" value="${esc(q)}" oninput="q=this.value;drawOrders()"></div>
  <div id="groups"></div>`;
  drawOrders();
  const on=document.querySelector("#sbar .on"); on&&on.scrollIntoView({inline:"center",block:"nearest"});
}
function drawOrders(){
  const t=q.trim(), all=D.orders.filter(o=>o.status===TF), hint=(GROUPS.find(g=>g[0]===TF)||[])[2];
  const list=(t?D.orders.filter(matches):all), lim=100;
  $("groups").innerHTML=`${!t&&hint?`<div class="hint" style="padding:0 4px 10px;color:var(--mut);font-size:13.5px">${hint}</div>`:""}`+(list.length?`<div class="olist">${list.slice(0,lim).map(oc2).join("")}</div>`:`<div class="empty">${EMPTY_SVG}<b>لا توجد طلبات</b></div>`);
}
const jump=k=>{TF=k;vOrders()};
let GO={};

/* ===== النوافذ ===== */
function ask(title,html,ok,cls,icon){
  return new Promise(res=>{
    const d=document.createElement("div"); d.className="dlg";
    const col=cls==="r"?"#ef4444":cls==="p"?"#2563eb":"#16a34a";
    d.innerHTML=`<div><div class="di" style="--dc:${col}">${ic(icon||(cls==="r"?"xc":"checkc"))}</div><h3>${title}</h3><div class="bd">${html}</div>
      <div style="display:flex;gap:10px"><button class="btn btn-${cls||"g"}" style="flex:1" id="dk">${ok}</button><button class="btn btn-o" style="flex:1" id="dc">إلغاء</button></div></div>`;
    const done=v=>{d.remove();res(v)};
    d.querySelector("#dk").onclick=()=>done(true); d.querySelector("#dc").onclick=()=>done(false);
    d.onclick=e=>{if(e.target===d)done(false)}; document.body.appendChild(d);
  });
}
const askDeliver=id=>{const o=D.orders.find(x=>x.id===id);
  return ask("تأكيد التسليم",`هل سلّمت الطلب <b>#${o.order_no}</b> للزبون <b>${esc(o.customer_name)}</b>؟<br>المبلغ المستلم من الزبون:<div style="font-size:26px;font-weight:800;color:#15803d">${money(o.total)}</div><div class="mut">سيُخصم المنتجات من جردك ولا يمكن التراجع.</div>`,"نعم، تم التسليم","g","checkc")};
async function quick(id,k){
  if(k==="delivered"){ if(!await askDeliver(id)) return; if(await run(sb.rpc("deliver_order",{p_order:id,p_note:null}),"تم التسليم")) refresh(); return }
  if(await run(sb.rpc("set_order_status",{p_order:id,p_status:k,p_note:null}),k==="in_delivery"?"الطلب الآن قيد التوصيل":"تم")) refresh();
}
async function restore(id){ if(!await ask("استرجاع الطلب","استرجاع هذا الطلب ليعود «جديداً»؟","نعم، استرجاع","p","undo")) return;
  if(await run(sb.rpc("restore_order",{p_order:id,p_note:null}),"تم استرجاع الطلب")) refresh() }
function sheet(title,inner){ $("modal").innerHTML=`<div class="sheet"><div class="sh-h"><b>${title}</b><button class="x" onclick="closeStatus()">${ic("x")}</button></div>${inner}</div>`; $("modal").style.display="flex" }

/* طلب تعديل إجمالي الفاتورة */
function openPriceReq(id){
  const o=D.orders.find(x=>x.id===id);
  sheet(`طلب تعديل الإجمالي — #${o.order_no}`,`
   <div class="card" style="background:#f7f9fd;box-shadow:none"><div class="mut">إجمالي الفاتورة الحالي (شامل التوصيل)</div><div style="font-size:24px;font-weight:800">${money(o.total)}</div><div class="mut">منتجات ${money(o.items_total)} + توصيل ${money(o.delivery_fee)}</div></div>
   <label class="mut">الإجمالي المطلوب</label>
   <input id="pr_new" class="tx" type="number" min="0" step="0.01" value="${o.total}" inputmode="decimal" style="font-size:20px;font-weight:800">
   <div id="pr_d" style="margin:-2px 0 10px;font-weight:700"></div>
   <textarea id="pm_note" rows="2" placeholder="سبب طلب التعديل (مطلوب)"></textarea>
   <button class="btn btn-p btn-block" onclick="sendPriceReq('${id}')">${ic("tag")} إرسال الطلب للإداري</button>`);
  const cur=Number(o.total), upd=()=>{const v=parseFloat($("pr_new").value)||0,d=v-cur; $("pr_d").innerHTML=`<span style="color:${d>0?"#16a34a":d<0?"#dc2626":"#64748b"}">الفرق: ${d>0?"+":""}${money(d)}</span>`}; $("pr_new").oninput=upd; upd();
}
async function sendPriceReq(id){
  const o=D.orders.find(x=>x.id===id), note=$("pm_note").value.trim(), v=parseFloat($("pr_new").value);
  if(isNaN(v)||v<0) return toast("اكتب مبلغاً صحيحاً","err");
  if(v===Number(o.total)) return toast("المبلغ مطابق للإجمالي الحالي","err");
  if(v<Number(o.delivery_fee)) return toast("المبلغ أقل من أجرة التوصيل","err");
  if(!note) return toast("اكتب سبب طلب التعديل","err");
  if(await run(sb.rpc("request_price_change",{p_order:id,p_new_total:v,p_reason:note}),"تم إرسال الطلب للإداري")){ closeStatus(); refresh() }
}
/* تعديل مباشر (إن سمح الإداري) */
function openPrices(id){
  const o=D.orders.find(x=>x.id===id);
  sheet(`تعديل سعر الطلب #${o.order_no}`,`
   ${o.order_items.map(i=>`<div style="display:flex;gap:10px;align-items:center;margin-bottom:10px"><div style="flex:1"><b>${esc(i.products?.name)}</b> × ${i.qty}</div>
     <input class="tx pp" style="max-width:130px;margin:0" data-id="${i.id}" data-old="${i.unit_price}" data-list="${i.list_price}" data-q="${i.qty}" type="number" min="0" step="0.01" value="${i.unit_price}" oninput="pricesTotal()"></div>`).join("")}
   <div id="pm_t" class="mut" style="margin:6px 0"></div>
   <textarea id="pm_note" rows="2" placeholder="سبب تعديل السعر (مطلوب)"></textarea>
   <button class="btn btn-p btn-block" onclick="savePrices('${id}')">حفظ السعر</button>`);
  pricesTotal();
}
function pricesTotal(){
  let sum=0,lst=0; document.querySelectorAll(".pp").forEach(e=>{sum+=(parseFloat(e.value)||0)*e.dataset.q; lst+=e.dataset.list*e.dataset.q});
  $("pm_t").innerHTML=`إجمالي المنتجات: <b>${money(sum)}</b>`;
}
async function savePrices(id){
  const note=$("pm_note").value.trim(); if(!note) return toast("اكتب سبب تعديل السعر","err");
  const all=[...document.querySelectorAll(".pp")].map(e=>({item_id:e.dataset.id,unit_price:parseFloat(e.value),old:parseFloat(e.dataset.old)}));
  if(all.some(p=>isNaN(p.unit_price)||p.unit_price<0)) return toast("سعر غير صالح","err");
  const ch=all.filter(p=>p.unit_price!==p.old); if(!ch.length) return toast("لم تغيّر أي سعر","err");
  if(await run(sb.rpc("update_order_prices",{p_order:id,p_prices:ch.map(({item_id,unit_price})=>({item_id,unit_price})),p_note:note}),"تم حفظ السعر")){ closeStatus(); refresh() }
}

/* نافذة تحديث الحالة */
const SOPTS=[{k:"in_delivery",l:"قيد التوصيل"},{k:"delivered",l:"تم التسليم"},{k:"no_answer",l:"لم يتم الرد"},{k:"closed",l:"مغلق"},{k:"other",l:"ملاحظة أخرى"},{k:"cancelled",l:"إلغاء الطلب"}];
let SM=null;
function openStatus(id){ const o=D.orders.find(x=>x.id===id); SM={id,k:SOPTS.some(x=>x.k===o.status)?o.status:null,note:o.captain_note||""}; drawStatus() }
function closeStatus(){ SM=null; $("modal").style.display="none"; $("modal").innerHTML="" }
function pickStatus(k){ SM.note=$("sm_note").value; SM.k=k; drawStatus() }
function drawStatus(){
  const o=D.orders.find(x=>x.id===SM.id);
  const ph=SM.k==="other"?"اكتب الملاحظة (مطلوبة)":SM.k==="cancelled"?"سبب الإلغاء (اختياري)":"ملاحظة (اختياري)";
  $("modal").innerHTML=`<div class="sheet" style="animation:none"><div class="sh-h"><b>#${o.order_no} — ${esc(o.customer_name)}</b><button class="x" onclick="closeStatus()">${ic("x")}</button></div>
    <div class="opts">${SOPTS.map(x=>`<button class="opt ${SM.k===x.k?"sel":""}" style="--sc:${SCOL[x.k]}" onclick="pickStatus('${x.k}')"><span class="oi">${ic(SICO[x.k])}</span>${x.l}</button>`).join("")}</div>
    <textarea id="sm_note" rows="3" placeholder="${ph}">${esc(SM.note)}</textarea>
    <button class="btn btn-p btn-block" onclick="submitStatus()" ${SM.k?"":"disabled"}>حفظ</button></div>`;
  $("modal").style.display="flex";
}
async function submitStatus(){
  const note=$("sm_note").value.trim(), k=SM.k, id=SM.id;
  if(k==="other"&&!note) return toast("اكتب الملاحظة","err");
  if(k==="cancelled"&&!await ask("إلغاء الطلب","هل تريد إلغاء هذا الطلب؟","نعم، إلغاء","r","xc")) return;
  if(k==="delivered"&&!await askDeliver(id)) return;
  const call = k==="delivered" ? sb.rpc("deliver_order",{p_order:id,p_note:note||null})
             : k==="cancelled" ? sb.rpc("cancel_order",{p_order:id,p_note:note||null})
             : sb.rpc("set_order_status",{p_order:id,p_status:k,p_note:note||null});
  if(await run(call,"تم الحفظ")){ closeStatus(); refresh() }
}

/* ===== الجرد والحساب ===== */
let SF="all", SQ="";
function vStock(){
  const low=Number(D.settings.low_stock||3);
  const all=D.stock||[];
  const st=q=>q<=0?"out":q<=low?"low":"ok";
  const units=all.reduce((a,s)=>a+Math.max(0,Number(s.qty)||0),0);
  const nLow=all.filter(s=>st(s.qty)==="low").length, nOut=all.filter(s=>st(s.qty)==="out").length;
  const cnt={all:all.length,low:nLow,out:nOut};
  $("main").innerHTML = `<button class="stk-back" onclick="go('acc')">${ic("back")||"→"} رجوع إلى حسابي</button><div class="stk-hero"><div><div class="stk-l">إجمالي القطع معي</div><div class="stk-n">${units}</div></div><div class="stk-ic">${ic("store")}</div></div>
   <div class="stk-tiles"><div class="stk-t"><b>${all.length}</b><span>صنف</span></div><div class="stk-t" style="color:#b45309"><b>${nLow}</b><span>منخفض</span></div><div class="stk-t" style="color:#dc2626"><b>${nOut}</b><span>نفد</span></div></div>
   <input id="stkq" class="stk-q" placeholder="ابحث عن منتج…" value="${esc(SQ)}" oninput="SQ=this.value;drawStock()">
   <div class="stk-ch">${[["all","الكل"],["low","منخفض"],["out","نفد"]].map(([k,l])=>`<button class="${SF===k?"on":""}" onclick="SF='${k}';vStock()">${l} <i>${cnt[k]}</i></button>`).join("")}</div>
   <div id="stklist"></div>`;
  drawStock();
}
function drawStock(){
  const low=Number(D.settings.low_stock||3), q=SQ.trim().toLowerCase();
  const st=n=>n<=0?"out":n<=low?"low":"ok";
  const rank={out:0,low:1,ok:2};
  const L={ok:"متوفر",low:"منخفض",out:"نفد"}, C={ok:"#16a34a",low:"#f59e0b",out:"#ef4444"};
  const list=(D.stock||[]).filter(s=>(SF==="all"||st(s.qty)===SF)&&(!q||String(s.products?.name||"").toLowerCase().includes(q)))
    .sort((x,y)=>rank[st(x.qty)]-rank[st(y.qty)]||String(x.products?.name).localeCompare(String(y.products?.name),"ar"));
  const mx=Math.max(10,low*3,...(D.stock||[]).map(s=>Number(s.qty)||0));
  $("stklist").innerHTML = list.length?list.map(s=>{const k=st(s.qty),p=Math.max(4,Math.min(100,Math.round((Number(s.qty)||0)/mx*100)));
    return `<div class="stk-c"><div class="stk-av" style="background:${C[k]}1a;color:${C[k]}">${esc(String(s.products?.name||"؟").trim().charAt(0))}</div>
     <div class="stk-m"><b>${esc(s.products?.name)}</b><div class="stk-bar"><i style="width:${k==="out"?0:p}%;background:${C[k]}"></i></div></div>
     <div class="stk-r"><div class="stk-q2" style="color:${C[k]}">${s.qty}</div><span class="stk-b" style="background:${C[k]}1a;color:${C[k]}">${L[k]}</span></div></div>`}).join("")
   :`<div class="empty" style="box-shadow:none">${EMPTY_SVG}<b>${(D.stock||[]).length?"لا نتائج مطابقة":"لا يوجد جرد مسجَّل"}</b><span>${(D.stock||[]).length?"جرّب تغيير البحث أو الفلتر":"سيضيف الإداري بضاعتك قريباً"}</span></div>`;
}
let ASUB="";
function dayLbl(d){ return new Date(d).toLocaleDateString("ar",{weekday:"long",day:"numeric",month:"long",year:"numeric"}) }
function dayKey(d){ const x=new Date(d); return x.getFullYear()+"-"+x.getMonth()+"-"+x.getDate() }
function vAccSub(){
  const T={orders:"الطلبات المسلّمة",pay:"الدفعات المسددة",fees:"أجور التوصيل"}[ASUB];
  let items;
  if(ASUB==="pay") items=(D.payments||[]).map(p=>({t:p.created_at,amt:Number(p.amount)||0,html:`<div class="row2"><div class="ri" style="background:#16a34a">${ic("check")}</div><div class="m"><b>دفعة مسددة</b><div class="mut">${new Date(p.created_at).toLocaleTimeString("ar",{hour:"numeric",minute:"2-digit"})}${p.note?" · "+esc(p.note):""}</div></div><b class="v">${money(p.amount)}</b></div>`}));
  else items=(D.orders||[]).filter(o=>o.status==="delivered").map(o=>{const t=o.delivered_at||o.status_at||o.created_at,amt=Number(ASUB==="fees"?o.delivery_fee:o.items_total)||0;
    return {t,amt,html:`<div class="row2" onclick="openOrder('${o.id}')" style="cursor:pointer"><div class="ri" style="background:${ASUB==="fees"?"#f59e0b":"#2563eb"}">${ic(ASUB==="fees"?"truck":"box")}</div><div class="m"><b>#${o.order_no} — ${esc(o.customer_name)}</b><div class="mut">${new Date(t).toLocaleTimeString("ar",{hour:"numeric",minute:"2-digit"})}${ASUB==="fees"?" · أجرة التوصيل":" · قيمة المنتجات"}</div></div><b class="v">${money(amt)}</b></div>`}});
  items.sort((a,b)=>new Date(b.t)-new Date(a.t));
  const g=[],idx={}; items.forEach(i=>{const k=dayKey(i.t); if(!(k in idx)){idx[k]=g.length;g.push({t:i.t,l:[],sum:0})} const e=g[idx[k]]; e.l.push(i.html); e.sum+=i.amt});
  const tot=items.reduce((a,i)=>a+i.amt,0);
  $("main").innerHTML=`<button class="stk-back" onclick="ASUB='';vAcc()">رجوع إلى حسابي</button>
   <div class="stk-hero"><div><div class="stk-l">مجموع ${T}</div><div class="stk-n" style="font-size:30px">${money(tot)}</div></div><div class="stk-ic" style="font-size:18px;font-weight:800">${items.length}</div></div>
   ${g.length?g.map(d=>`<div class="dayh"><b>${dayLbl(d.t)}</b><span>${money(d.sum)}</span></div><div class="card" style="padding:4px 12px">${d.l.join("")}</div>`).join(""):`<div class="empty" style="box-shadow:none">${EMPTY_SVG}<b>لا توجد بيانات بعد</b></div>`}`;
}
function vAcc(){
  if(ASUB) return vAccSub();
  const b=D.balance||{};
  const sq=(D.stock||[]).reduce((a,x)=>a+Math.max(0,Number(x.qty)||0),0);
  const row=(c,i,l,v,k)=>`<div class="acr" onclick="ASUB='${k}';vAcc()"><div class="acr-i" style="background:${c}">${ic(i)}</div><div class="acr-l">${l}</div><div class="acr-v">${v}</div><span class="acr-ch">‹</span></div>`;
  $("main").innerHTML = `<div class="bal"><div style="opacity:.85">المتبقي عليّ تسليمه للإدارة</div><div class="big">${money(b.balance)}</div><div style="opacity:.85;font-size:14px">${b.delivered_count||0} طلب مُسلَّم</div></div>
   <div class="card acr-card">
    ${row("#2563eb","box","مجموع الطلبات المسلّمة",money(b.delivered_total),"orders")}
    ${row("#16a34a","cash","مجموع الدفعات المسددة",money(b.paid_total),"pay")}
    ${row("#f59e0b","truck","مجموع أجور التوصيل",money(b.fees_total),"fees")}
   </div>
   <button class="stk-go" onclick="go('stock')"><span class="stk-gi">${ic("store")}</span><span style="flex:1;text-align:start"><b>جرد المستودع</b><small>${(D.stock||[]).length} صنف · ${sq} قطعة</small></span><span style="font-size:22px;color:#94a3b8">‹</span></button>
   <div class="card"><h2>${ic("wallet")} الدفعات المسددة</h2>${D.payments.length?D.payments.map(p=>`<div class="row2"><div class="ri" style="background:#16a34a">${ic("check")}</div><div class="m"><b>${dt(p.created_at)}</b>${p.note?`<div class="mut">${esc(p.note)}</div>`:""}</div><b class="v">${money(p.amount)}</b></div>`).join(""):`<div class="empty" style="box-shadow:none">${EMPTY_SVG}<b>لا توجد دفعات بعد</b></div>`}</div>`;
}

/* ===== سحب للتحديث ===== */
let ptr=null;
addEventListener("touchstart",e=>{ if(scrollY<=0&&me&&$("modal").style.display!=="flex") ptr={y:e.touches[0].clientY} },{passive:true});
addEventListener("touchmove",e=>{ if(!ptr) return; const d=e.touches[0].clientY-ptr.y; const p=$("ptr"); if(d>10&&scrollY<=0){ p.style.transform=`translateY(${Math.min(d,100)-80}px) rotate(${d*3}deg)`; p.classList.toggle("ready",d>80) } },{passive:true});
addEventListener("touchend",async()=>{ if(!ptr) return; ptr=null; const p=$("ptr"), ready=p.classList.contains("ready"); p.style.transform=""; p.classList.remove("ready");
  if(ready){ p.style.transform="translateY(-10px)"; p.classList.add("spin"); await load(); render(); p.classList.remove("spin"); p.style.transform="" } });

$("i_mail").innerHTML=ic("mail"); $("i_lock").innerHTML=ic("lock"); $("eye").innerHTML=ic("eye");
$("eye").onclick=()=>{ const p=$("pw"); p.type=p.type==="password"?"text":"password" };

$("rf").innerHTML=ic("refresh"); $("lo").innerHTML=ic("logout"); initNotifUI();
$("t_orders").innerHTML=ic("box")+"<span>طلباتي</span>"; $("t_stock").innerHTML=ic("store")+"<span>جرد المستودع</span>"; $("t_acc").innerHTML=ic("wallet")+"<span>حسابي</span>";
if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
boot();
