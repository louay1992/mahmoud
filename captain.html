<body>
<div id="splash"><div class="logo"><svg class="i" viewBox="0 0 24 24" style="fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M1 3h15v13H1zM16 8h4l3 3v5h-7z"/><circle cx="5.5" cy="18.5" r="2"/><circle cx="18.5" cy="18.5" r="2"/></svg></div><b>كابتن التوصيل</b><div class="spin"></div></div>
<div id="bar"></div><div id="offline">لا يوجد اتصال بالإنترنت — سيتم التحديث عند عودته</div>


<div id="login">
  <div class="hero">
    <svg class="truck" viewBox="0 0 260 150" fill="none"><ellipse cx="130" cy="138" rx="105" ry="8" fill="rgba(0,0,0,.16)"/>
      <rect x="22" y="38" width="130" height="80" rx="12" fill="#fff"/><rect x="152" y="62" width="66" height="56" rx="10" fill="#dbeafe"/>
      <path d="M160 70h34l16 18v12h-50z" fill="#93c5fd"/><rect x="38" y="54" width="46" height="34" rx="7" fill="#fbbf24"/><path d="M48 66h26M48 76h18" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <circle cx="64" cy="122" r="17" fill="#1e293b"/><circle cx="64" cy="122" r="7" fill="#cbd5e1"/><circle cx="192" cy="122" r="17" fill="#1e293b"/><circle cx="192" cy="122" r="7" fill="#cbd5e1"/>
      <path d="M8 70h-4M12 86H2M10 102H0" stroke="rgba(255,255,255,.7)" stroke-width="4" stroke-linecap="round"/></svg>
    <h1>كابتن التوصيل</h1><p>سجّل دخولك لتبدأ استلام طلباتك</p>
  </div>
  <div class="panel"><div class="in">
    <div class="fld"><span id="i_mail"></span><input id="em" type="text" placeholder="رقم الموبايل" dir="ltr" autocomplete="username" inputmode="tel"></div>
    <div class="fld"><span id="i_lock"></span><input id="pw" type="password" placeholder="كلمة المرور" dir="ltr" autocomplete="current-password"><button class="eye" type="button" id="eye" aria-label="إظهار كلمة المرور"></button></div>
    <button class="btn btn-p btn-block" id="lbtn" onclick="login()">دخول</button>
  </div></div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="av" id="av">ك</div>
    <div class="tt"><b id="hn">كابتن التوصيل</b><span id="hs"></span></div>
    <button class="ib" id="bell" onclick="go('notifs')" aria-label="الإشعارات"></button>
    <button class="ib" id="rf" onclick="manualRefresh()" aria-label="تحديث"></button>
    <button class="ib" id="lo" onclick="logout()" aria-label="خروج"></button>
  </header>
  <main id="main"></main>
  <nav><div class="row">
    <button id="t_orders" onclick="go('orders')"></button>
    <button id="t_stock" onclick="go('stock')" style="display:none"></button>
    <button id="t_acc" onclick="go('acc')"></button>
  </div></nav>
</div>
<div id="upd"></div>
<div id="modal" onclick="if(event.target===this)closeStatus()"></div>
<div id="toast"></div>
<script src="/captain-app.js"></script>
</body>
</html>
