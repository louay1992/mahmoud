<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d4ed8">
<title>كابتن التوصيل</title>
<link rel="manifest" href="/manifest-captain.json">
<link rel="apple-touch-icon" href="/icons/captain-apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#1d4ed8;--bg:#f4f6f8;--bd:#e2e8f0;--tx:#1e293b;--mut:#64748b;--red:#dc2626;--grn:#16a34a;--amb:#d97706}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,"Segoe UI",Tahoma,Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
header{background:var(--p);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:17px;margin:0}
nav{display:flex;background:#fff;border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
nav button{flex:1;border:0;border-bottom:3px solid transparent;background:#fff;padding:12px 4px;font:inherit;cursor:pointer}
nav button.on{border-color:var(--p);color:var(--p);font-weight:700}
main{max-width:640px;margin:0 auto;padding:12px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.card h2{font-size:16px;margin:0 0 8px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:8px;font:inherit;margin-bottom:8px}
button.b{background:var(--p);color:#fff;border:0;padding:11px 16px;border-radius:8px;font:inherit;cursor:pointer}
button.g{background:var(--grn)}button.r{background:var(--red)}button.o{background:#fff;color:var(--p);border:1px solid var(--p)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.acts button{flex:1 1 90px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:right}
th{color:var(--mut);font-size:13px}
.tag{padding:2px 9px;border-radius:12px;font-size:12px;color:#fff}
.assigned{background:var(--amb)}.delivered{background:var(--grn)}.cancelled{background:var(--red)}.returned{background:#7c3aed}.in_delivery{background:#2563eb}.no_answer{background:#ea580c}.closed{background:#475569}.other{background:#0891b2}.new{background:#64748b}
.mut{color:var(--mut);font-size:14px}.neg{color:var(--red);font-weight:700}
.big{font-size:30px;font-weight:700}
a.call{color:var(--p);text-decoration:none;font-weight:600}
#login{max-width:340px;margin:12vh auto;padding:0 14px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:9}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px;max-height:90vh;overflow:auto}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.x{border:0;background:#f1f5f9;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.opt{display:flex;align-items:center;gap:8px;padding:14px 12px;border:2px solid var(--bd);border-radius:12px;background:#fff;font:inherit;cursor:pointer;text-align:right}
.opt span{font-size:22px}.opt.sel{border-color:var(--p);background:#eff6ff;font-weight:700}
button:disabled{opacity:.5;cursor:not-allowed}
.note{margin-top:6px;padding:8px 10px;border-radius:8px;background:#fff7ed;border:1px solid #fed7aa;font-size:14px}
.tl{margin-top:6px;font-size:13px;color:var(--mut)}.tl summary{cursor:pointer}
.tl div{padding:3px 0;border-top:1px dashed var(--bd)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;font:inherit}
.tile .i{font-size:20px}.tile .c{font-size:22px;font-weight:700;line-height:1.2}.tile .l{font-size:12px;color:var(--mut)}
.tile.z{opacity:.45}
.tile.hot{border-color:var(--amb);background:#fffbeb}
.grp{background:#fff;border:1px solid var(--bd);border-radius:12px;margin-bottom:12px;scroll-margin-top:60px}
.grp>summary{padding:13px 14px;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px;list-style:none}
.grp>summary::-webkit-details-marker{display:none}
.grp>summary .n{margin-inline-start:auto;background:#f1f5f9;border-radius:12px;padding:1px 11px;font-size:14px}
.grp .hint{padding:0 14px 8px;color:var(--mut);font-size:13px}
.grp .inner{padding:0 10px 4px}.grp .card{background:#fafbfc}
a.callbtn{display:block;text-align:center;text-decoration:none;background:#fff;color:var(--p);border:1px solid var(--p);padding:11px 16px;border-radius:8px;flex:1 1 90px}
</style>
</head>
<body>
<div id="login" style="display:none"><div class="card"><h2>تسجيل دخول الكابتن</h2>
  <input id="em" type="email" placeholder="البريد الإلكتروني" dir="ltr">
  <input id="pw" type="password" placeholder="كلمة المرور" dir="ltr">
  <button class="b" style="width:100%" onclick="login()">دخول</button></div></div>
<div id="app" style="display:none">
  <header><h1 id="hname">🚚 كابتن التوصيل</h1><button class="b o" style="padding:6px 12px" onclick="logout()">خروج</button></header>
  <nav><button id="t_orders" onclick="go('orders')">طلباتي</button><button id="t_stock" onclick="go('stock')">جردي</button><button id="t_acc" onclick="go('acc')">حسابي</button></nav>
  <main id="main"></main>
</div>
<div id="modal" onclick="if(event.target===this)closeStatus()"></div>
<div id="toast"></div>
<script>
// ====== نفس بيانات مشروع Supabase المستخدمة في التطبيق الإداري ======
const SUPABASE_URL = "https://jabapvnmfdflysxfxwwf.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphYmFwdm5tZmRmbHlzeGZ4d3dmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU1MTg2OTQsImV4cCI6MjExMTA5NDY5NH0.V-Axtg4cGwiSYNhcefmks0MP4iOn2DW5Ai74Ji8cv9I";
// ===================================================================
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let CUR = "", BIZ = "";
const money = n => Number(n || 0).toLocaleString("en-US", {maximumFractionDigits: 2}) + (CUR ? " " + CUR : "");
const dt = s => s ? new Date(s).toLocaleString("ar-EG", {dateStyle: "short", timeStyle: "short"}) : "";
const ST = {new:"جديد", assigned:"جديد", in_delivery:"قيد التوصيل", no_answer:"لم يتم الرد", closed:"مغلق", other:"ملاحظة أخرى", delivered:"مُسلَّم", cancelled:"ملغي", returned:"مُرجَع"};
const OPEN = ["assigned","in_delivery","no_answer","closed","other"];
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2800)}
async function run(p, ok){const {error}=await p; if(error){toast("خطأ: "+error.message);return false} if(ok)toast(ok); return true}

let me=null, D={orders:[],stock:[],payments:[],balance:null,ev:{},settings:{}}, tab="orders", q="";

async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ $("login").style.display="block"; $("app").style.display="none"; return }
  const {data} = await sb.from("captains").select("*").limit(1);
  if(!data || !data.length){ toast("هذا الحساب غير مرتبط بكابتن"); await sb.auth.signOut(); $("login").style.display="block"; return }
  me = data[0]; $("hname").textContent = "🚚 " + me.name;
  $("login").style.display="none"; $("app").style.display="block";
  await load(); go("orders");
}
async function login(){
  const {error} = await sb.auth.signInWithPassword({email:$("em").value.trim(), password:$("pw").value});
  if(error) return toast("فشل الدخول: "+error.message); boot();
}
async function logout(){ await sb.auth.signOut(); location.reload() }

async function load(){
  const r = await Promise.all([
    sb.from("orders").select("*, order_items(id, qty, unit_price, list_price, products(name))").order("created_at",{ascending:false}).limit(200),
    sb.from("stock").select("qty, products(name)"),
    sb.from("captain_payments").select("*").order("created_at",{ascending:false}),
    sb.from("captain_balances").select("*").limit(1),
    sb.from("settings").select("*"),
    sb.from("order_events").select("*").order("created_at",{ascending:true}).limit(1000),
    sb.from("price_requests").select("*").order("created_at",{ascending:false}).limit(300),
  ]);
  r.forEach(x => x.error && toast("خطأ تحميل: "+x.error.message));
  D.orders=r[0].data||[]; D.stock=(r[1].data||[]).sort((a,b)=>(a.products?.name||"").localeCompare(b.products?.name||"","ar"));
  D.payments=r[2].data||[]; D.balance=(r[3].data||[])[0]||null;
  const st=Object.fromEntries((r[4].data||[]).map(x=>[x.key,x.value])); CUR=st.currency||""; BIZ=st.business_name||""; D.settings=st;
  $("hname").textContent="🚚 "+me.name+(BIZ?" — "+BIZ:"");
  D.pr={}; (r[6].data||[]).forEach(x=>{ (D.pr[x.order_id]=D.pr[x.order_id]||[]).push(x) });
  D.ev={}; (r[5].data||[]).forEach(e=>(D.ev[e.order_id]=D.ev[e.order_id]||[]).push(e));
  const n=D.orders.filter(o=>OPEN.includes(o.status)).length; $("t_orders").textContent="طلباتي"+(n?" ("+n+")":"");
}
function go(t){ tab=t; ["orders","stock","acc"].forEach(k=>$("t_"+k).classList.toggle("on",k===t)); render() }
async function refresh(){ await load(); render() }
function render(){ ({orders:vOrders,stock:vStock,acc:vAcc})[tab]() }

const GROUPS=[
 ["assigned","🆕","طلبات جديدة","طلبات وصلتك حديثاً. اضغط «🚚 قيد التوصيل» عندما تبدأ بتوصيل الطلب.",true],
 ["in_delivery","🚚","قيد التوصيل","طلبات بدأت توصيلها وأنت في طريقك لتسليمها.",true],
 ["no_answer","📵","لم يتم الرد","اتصل بالزبون مجدداً، ثم «إعادة المحاولة» أو سلّم الطلب.",true],
 ["closed","🔒","مغلق","هاتف الزبون مغلق. أعد المحاولة لاحقاً.",true],
 ["other","📝","ملاحظات أخرى","طلبات عليها ملاحظة خاصة.",true],
 ["cancelled","❌","ملغية","يمكنك استرجاع أي طلب ملغي ليعود «جديداً».",false],
 ["delivered","✅","مُسلَّمة","",false]];
const itemsLine=o=>o.order_items.map(i=>{const d=Number(i.unit_price)-Number(i.list_price);return `${esc(i.products?.name)} × ${i.qty} @ ${money(i.unit_price)}${d?` <span style="color:${d>0?"#16a34a":"#dc2626"};font-size:12px">(سعر المنتج ${money(i.list_price)})</span>`:""}`}).join("<br>");
function oCard(o){
  const evs=D.ev[o.id]||[], k=o.status;
  const acts = k==="assigned" ? `<button class="b g" onclick="quick('${o.id}','in_delivery')">🚚 قيد التوصيل</button><button class="b o" onclick="openStatus('${o.id}')">الحالة</button>`
   : k==="in_delivery" ? `<button class="b g" onclick="quick('${o.id}','delivered')">✅ تم التسليم</button><button class="b o" onclick="openStatus('${o.id}')">الحالة</button>`
   : (k==="no_answer"||k==="closed"||k==="other") ? `<button class="b" onclick="quick('${o.id}','in_delivery')">🔄 إعادة المحاولة</button><button class="b g" onclick="quick('${o.id}','delivered')">✅ تم التسليم</button><button class="b o" onclick="openStatus('${o.id}')">الحالة</button>`
   : k==="cancelled" ? `<button class="b" onclick="restore('${o.id}')">↩️ استرجاع الطلب</button>` : "";
  return `<div class="card">
    <div style="display:flex;justify-content:space-between"><b>#${o.order_no} — ${esc(o.customer_name)}</b><span class="tag ${o.status}">${ST[o.status]||o.status}</span></div>
    <div>${itemsLine(o)}</div>
    <div style="margin-top:6px">المطلوب من الزبون: <b>${money(o.total)}</b> <span class="mut">(منتجات ${money(o.items_total)} + توصيل ${money(o.delivery_fee)})</span></div>
    ${o.note?`<div class="mut">📝 ${esc(o.note)}</div>`:""}
    ${o.captain_note?`<div class="note">🗒️ ${esc(o.captain_note)}</div>`:""}
    ${evs.length>1?`<details class="tl"><summary>سجل الطلب (${evs.length})</summary>${evs.map(e=>`<div><span class="tag ${e.status}">${ST[e.status]||e.status}</span> ${dt(e.created_at)}${e.note?" — "+esc(e.note):""}</div>`).join("")}</details>`:""}
    <div class="acts"><a class="callbtn" href="tel:${esc(o.customer_phone)}" dir="ltr">📞 ${esc(o.customer_phone)}</a>${acts}${(D.settings.captain_can_edit_price==="true"&&OPEN.includes(k))?`<button class="b o" onclick="openPrices('${o.id}')">💲 تعديل السعر</button>`:""}${(OPEN.includes(k)&&!prPending(o))?`<button class="b o" onclick="openPriceReq('${o.id}')">📝 طلب تعديل سعر</button>`:""}</div>
    ${prBox(o)}
    ${o.status==="delivered"?`<div class="mut" style="margin-top:6px">سُلِّم ${dt(o.delivered_at)}</div>`:""}
  </div>`;
}
function matches(o){ const t=q.trim().toLowerCase(); return !t||[o.customer_name,o.customer_phone,String(o.order_no)].some(v=>String(v||"").toLowerCase().includes(t)) }
function vOrders(){
  const cnt=k=>D.orders.filter(o=>o.status===k).length;
  $("main").innerHTML = `<div class="tiles">${GROUPS.filter(g=>g[0]!=="delivered").map(([k,ic,l])=>{const n=cnt(k);return `<button class="tile ${n?(k==="assigned"||k==="no_answer"?"hot":""):"z"}" onclick="jump('${k}')"><div class="i">${ic}</div><div class="c">${n}</div><div class="l">${l}</div></button>`}).join("")}</div>
  <div style="display:flex;gap:6px;margin-bottom:10px"><input id="oq" style="margin:0" placeholder="🔍 بحث بالاسم أو الموبايل أو الرقم" value="${esc(q)}" oninput="q=this.value;drawGroups()"><button class="b o" onclick="refresh()">تحديث</button></div>
  <div id="groups"></div>`;
  drawGroups();
}
let GO={};
function drawGroups(){
  $("groups").innerHTML = GROUPS.map(([k,ic,l,hint,open])=>{
    const all=D.orders.filter(o=>o.status===k), list=all.filter(matches), lim=k==="delivered"?20:100;
    const isOpen = ("g_"+k) in GO ? GO["g_"+k] : (open&&all.length>0);
    return `<details class="grp" id="g_${k}" ontoggle="GO[this.id]=this.open" ${isOpen||(q.trim()&&list.length)?"open":""}><summary><span>${ic}</span>${l}<span class="n">${all.length}</span></summary>
      ${hint?`<div class="hint">${hint}</div>`:""}
      <div class="inner">${list.length?list.slice(0,lim).map(oCard).join(""):'<p class="mut" style="padding:0 6px">لا توجد طلبات</p>'}${list.length>lim?`<p class="mut" style="padding:0 6px">يُعرض آخر ${lim} فقط.</p>`:""}</div></details>`}).join("");
}
function jump(k){ const d=$("g_"+k); if(!d) return; d.open=true; d.scrollIntoView({behavior:"smooth",block:"start"}) }
function prPending(o){ return (D.pr[o.id]||[]).find(x=>x.status==="pending") }
function prBox(o){
  const l=(D.pr[o.id]||[])[0]; if(!l) return "";
  const st={pending:["⏳ طلب تعديل الإجمالي بانتظار موافقة الإداري","#fff7e0"],approved:["✅ وافق الإداري على تعديل الإجمالي","#e6f7ec"],rejected:["❌ رفض الإداري تعديل الإجمالي","#fdeaea"]}[l.status];
  if(l.status!=="pending"&&(Date.now()-new Date(l.decided_at))>3*864e5) return "";
  return `<div style="background:${st[1]};border-radius:8px;padding:8px;margin-top:8px;font-size:13px"><b>${st[0]}</b><br>الإجمالي: ${money(l.old_total)} ← <b>${money(l.new_total)}</b><div class="mut">السبب: ${esc(l.reason)}</div>${l.admin_note?`<div>ملاحظة الإداري: ${esc(l.admin_note)}</div>`:""}</div>`;
}
function openPriceReq(id){
  const o=D.orders.find(x=>x.id===id);
  $("modal").innerHTML=`<div class="sheet"><div class="sh-h"><b>طلب تعديل إجمالي الفاتورة — #${o.order_no}</b><button class="x" onclick="closeStatus()">✕</button></div>
   <div style="margin-bottom:8px">إجمالي الفاتورة الحالي (شامل التوصيل): <b>${money(o.total)}</b><div class="mut">منتجات ${money(o.items_total)} + توصيل ${money(o.delivery_fee)}</div></div>
   <label class="mut">الإجمالي المطلوب</label>
   <input id="pr_new" type="number" min="0" step="0.01" value="${o.total}" inputmode="decimal">
   <div id="pr_d" class="mut" style="margin:4px 0 8px"></div>
   <textarea id="pm_note" rows="2" placeholder="سبب طلب التعديل (مطلوب)"></textarea>
   <button class="b" style="width:100%" onclick="sendPriceReq('${id}')">إرسال الطلب للإداري</button></div>`;
  $("modal").style.display="flex";
  const cur=Number(o.total), upd=()=>{const v=parseFloat($("pr_new").value)||0,d=v-cur; $("pr_d").innerHTML=`الفرق: <b>${d>0?"+":""}${money(d)}</b>`}; $("pr_new").oninput=upd; upd();
}
async function sendPriceReq(id){
  const o=D.orders.find(x=>x.id===id), note=$("pm_note").value.trim(), v=parseFloat($("pr_new").value);
  if(isNaN(v)||v<0) return toast("اكتب مبلغاً صحيحاً");
  if(v===Number(o.total)) return toast("المبلغ مطابق للإجمالي الحالي");
  if(v<Number(o.delivery_fee)) return toast("المبلغ أقل من أجرة التوصيل");
  if(!note) return toast("اكتب سبب طلب التعديل");
  if(await run(sb.rpc("request_price_change",{p_order:id,p_new_total:v,p_reason:note}),"تم إرسال الطلب للإداري")){ closeStatus(); refresh() }
}
function openPrices(id){
  const o=D.orders.find(x=>x.id===id);
  $("modal").innerHTML=`<div class="sheet"><div class="sh-h"><b>تعديل سعر الطلب #${o.order_no}</b><button class="x" onclick="closeStatus()">✕</button></div>
   ${o.order_items.map(i=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px"><div style="flex:1"><b>${esc(i.products?.name)}</b> × ${i.qty}<div class="mut">سعر المنتج: ${money(i.list_price)}</div></div>
     <input class="pp" style="max-width:120px;margin:0" data-id="${i.id}" data-old="${i.unit_price}" data-list="${i.list_price}" data-q="${i.qty}" type="number" min="0" step="0.01" value="${i.unit_price}" oninput="pricesTotal()"></div>`).join("")}
   <div id="pm_t" class="mut" style="margin:6px 0"></div>
   <textarea id="pm_note" rows="2" placeholder="سبب تعديل السعر (مطلوب)"></textarea>
   <button class="b" style="width:100%" onclick="savePrices('${id}')">حفظ السعر</button></div>`;
  $("modal").style.display="flex"; pricesTotal();
}
function pricesTotal(){
  let sum=0,lst=0; document.querySelectorAll(".pp").forEach(e=>{sum+=(parseFloat(e.value)||0)*e.dataset.q; lst+=e.dataset.list*e.dataset.q});
  $("pm_t").innerHTML=`إجمالي المنتجات: <b>${money(sum)}</b> · بسعر المنتج: ${money(lst)}`;
}
async function savePrices(id){
  const note=$("pm_note").value.trim(); if(!note) return toast("اكتب سبب تعديل السعر");
  const all=[...document.querySelectorAll(".pp")].map(e=>({item_id:e.dataset.id,unit_price:parseFloat(e.value),old:parseFloat(e.dataset.old)}));
  if(all.some(p=>isNaN(p.unit_price)||p.unit_price<0)) return toast("سعر غير صالح");
  const ch=all.filter(p=>p.unit_price!==p.old); if(!ch.length) return toast("لم تغيّر أي سعر");
  if(await run(sb.rpc("update_order_prices",{p_order:id,p_prices:ch.map(({item_id,unit_price})=>({item_id,unit_price})),p_note:note}),"تم حفظ السعر")){ closeStatus(); refresh() }
}
function ask(title,html,ok,cls){
  return new Promise(res=>{
    const d=document.createElement("div");
    d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px";
    d.innerHTML=`<div style="background:#fff;border-radius:14px;padding:18px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.3)"><h3 style="margin:0 0 8px">${title}</h3><div style="margin-bottom:14px;line-height:1.7">${html}</div>
      <div style="display:flex;gap:8px"><button class="b ${cls||"g"}" style="flex:1" id="dk">${ok}</button><button class="b o" style="flex:1" id="dc">إلغاء</button></div></div>`;
    const done=v=>{d.remove();res(v)};
    d.querySelector("#dk").onclick=()=>done(true); d.querySelector("#dc").onclick=()=>done(false);
    d.onclick=e=>{if(e.target===d)done(false)}; document.body.appendChild(d);
  });
}
const askDeliver=id=>{const o=D.orders.find(x=>x.id===id);
  return ask("✅ تأكيد التسليم",`هل سلّمت الطلب <b>#${o.order_no}</b> للزبون <b>${esc(o.customer_name)}</b>؟<br>المبلغ المستلم من الزبون: <b>${money(o.total)}</b><div class="mut" style="font-size:13px">سيُخصم المنتجات من جردك ولا يمكن التراجع.</div>`,"نعم، تم التسليم")};
async function quick(id,k){
  if(k==="delivered"){ if(!await askDeliver(id)) return; if(await run(sb.rpc("deliver_order",{p_order:id,p_note:null}),"تم التسليم")) refresh(); return }
  if(await run(sb.rpc("set_order_status",{p_order:id,p_status:k,p_note:null}),k==="in_delivery"?"الطلب الآن قيد التوصيل":"تم")) refresh();
}
async function restore(id){ if(!await ask("↩️ استرجاع الطلب","استرجاع هذا الطلب ليعود «جديداً»؟","نعم، استرجاع")) return;
  if(await run(sb.rpc("restore_order",{p_order:id,p_note:null}),"تم استرجاع الطلب")) refresh() }

/* ===== نافذة تحديث الحالة ===== */
const SOPTS=[{k:"in_delivery",l:"قيد التوصيل",i:"🚚"},{k:"delivered",l:"تم التسليم",i:"✅"},{k:"no_answer",l:"لم يتم الرد",i:"📵"},{k:"closed",l:"مغلق",i:"🔒"},{k:"other",l:"ملاحظة أخرى",i:"📝"},{k:"cancelled",l:"إلغاء الطلب",i:"❌"}];
let SM=null;
function openStatus(id){ const o=D.orders.find(x=>x.id===id); SM={id,k:SOPTS.some(x=>x.k===o.status)?o.status:null,note:o.captain_note||""}; drawStatus() }
function closeStatus(){ SM=null; $("modal").style.display="none"; $("modal").innerHTML="" }
function pickStatus(k){ SM.note=$("sm_note").value; SM.k=k; drawStatus() }
function drawStatus(){
  const o=D.orders.find(x=>x.id===SM.id);
  const ph=SM.k==="other"?"اكتب الملاحظة (مطلوبة)":SM.k==="cancelled"?"سبب الإلغاء (اختياري)":"ملاحظة (اختياري)";
  $("modal").innerHTML=`<div class="sheet"><div class="sh-h"><b>#${o.order_no} — ${esc(o.customer_name)}</b><button class="x" onclick="closeStatus()">✕</button></div>
    <div class="opts">${SOPTS.map(x=>`<button class="opt ${SM.k===x.k?"sel":""}" onclick="pickStatus('${x.k}')"><span>${x.i}</span>${x.l}</button>`).join("")}</div>
    <textarea id="sm_note" rows="3" placeholder="${ph}">${esc(SM.note)}</textarea>
    <button class="b" style="width:100%" onclick="submitStatus()" ${SM.k?"":"disabled"}>حفظ</button></div>`;
  $("modal").style.display="flex";
}
async function submitStatus(){
  const note=$("sm_note").value.trim(), k=SM.k, id=SM.id;
  if(k==="other"&&!note) return toast("اكتب الملاحظة");
  if(k==="cancelled"&&!await ask("❌ إلغاء الطلب","هل تريد إلغاء هذا الطلب؟","نعم، إلغاء","r")) return;
  if(k==="delivered"&&!await askDeliver(id)) return;
  const call = k==="delivered" ? sb.rpc("deliver_order",{p_order:id,p_note:note||null})
             : k==="cancelled" ? sb.rpc("cancel_order",{p_order:id,p_note:note||null})
             : sb.rpc("set_order_status",{p_order:id,p_status:k,p_note:note||null});
  if(await run(call,"تم الحفظ")){ closeStatus(); refresh() }
}

function vStock(){
  $("main").innerHTML = `<div class="card"><h2>الجرد الموجود معي</h2>
   ${D.stock.length?`<table><tr><th>المنتج</th><th>الكمية</th></tr>${D.stock.map(s=>`<tr><td>${esc(s.products?.name)}</td><td class="${s.qty<0?"neg":""}">${s.qty}</td></tr>`).join("")}</table>`:'<p class="mut">لا يوجد جرد مسجَّل</p>'}</div>`;
}
function vAcc(){
  const b=D.balance||{};
  $("main").innerHTML = `<div class="card"><div class="mut">المتبقي عليّ تسليمه</div><div class="big ${b.balance<0?"neg":""}">${money(b.balance)}</div>
   <div class="mut">طلبات مُسلَّمة: ${b.delivered_count||0} · قيمة المنتجات ${money(b.delivered_total)} · سلّمتُه: ${money(b.paid_total)}<br>أجور التوصيل التي لي: ${money(b.fees_total)}</div></div>
   <div class="card"><h2>الدفعات التي سلّمتُها</h2>${D.payments.length?`<table><tr><th>التاريخ</th><th>المبلغ</th><th>ملاحظة</th></tr>${D.payments.map(p=>`<tr><td>${dt(p.created_at)}</td><td>${money(p.amount)}</td><td>${esc(p.note)}</td></tr>`).join("")}</table>`:'<p class="mut">لا توجد دفعات</p>'}</div>`;
}
setInterval(()=>{ if(me && !document.hidden && tab==="orders" && !SM) refresh() }, 30000);
if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
boot();
</script>
</body>
</html>
