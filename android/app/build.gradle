plugins { id 'com.android.application' }
def firebaseConfigured = file('google-services.json').exists()
if (firebaseConfigured) apply plugin: 'com.google.gms.google-services'
def sourceHtml = rootProject.file('../admin.html').getText('UTF-8')
def apiKey = (sourceHtml =~ /const SUPABASE_KEY = "([^"]+)"/)[0][1]
android {
    namespace 'app.hhyyw.twa'
    compileSdk 34
    defaultConfig {
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName "1.2.0"
        buildConfigField 'String', 'SUPABASE_URL', '"https://jabapvnmfdflysxfxwwf.supabase.co"'
        buildConfigField 'String', 'SUPABASE_ANON_KEY', '"' + apiKey + '"'
        buildConfigField 'boolean', 'FCM_CONFIGURED', firebaseConfigured.toString()
    }
    flavorDimensions "app"
    productFlavors {
        admin {
            dimension "app"
            applicationId "app.hhyyw.admin"
            buildConfigField 'String', 'APP_SCOPE', '"admin"'
            manifestPlaceholders = [appName: "الإدارة", startUrl: "https://hhyyw.netlify.app/admin", host: "hhyyw.netlify.app", pathPrefix: "/admin"]
            resValue "string", "app_name", "الإدارة"
        }
        captain {
            dimension "app"
            applicationId "app.hhyyw.captain"
            buildConfigField 'String', 'APP_SCOPE', '"captain"'
            manifestPlaceholders = [appName: "كابتن التوصيل", startUrl: "https://hhyyw.netlify.app/captain", host: "hhyyw.netlify.app", pathPrefix: "/captain"]
            resValue "string", "app_name", "كابتن التوصيل"
        }
    }
    buildTypes { release { minifyEnabled false } }
    buildFeatures { buildConfig true }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.firebase:firebase-messaging:24.1.2'
    implementation 'androidx.work:work-runtime:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}
