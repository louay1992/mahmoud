plugins { id 'com.android.application' }
def firebaseConfigured = file('google-services.json').exists()
if (firebaseConfigured) apply plugin: 'com.google.gms.google-services'
def appConfig = rootProject.file('../app-config.js').getText('UTF-8')
def apiKey = (appConfig =~ /supabaseAnonKey:\s*"([^"]+)"/)[0][1]
def supabaseUrl = (appConfig =~ /supabaseUrl:\s*"([^"]+)"/)[0][1]
def appOrigin = (appConfig =~ /appOrigin:\s*"([^"]+)"/)[0][1]
def appHost = java.net.URI.create(appOrigin).getHost()
android {
    namespace 'app.hhyyw.twa'
    compileSdk 34
    defaultConfig {
        minSdk 23
        targetSdk 34
        versionCode 11
        versionName "1.4.4"
        buildConfigField 'String', 'SUPABASE_URL', '"' + supabaseUrl + '"'
        buildConfigField 'String', 'SUPABASE_ANON_KEY', '"' + apiKey + '"'
        buildConfigField 'boolean', 'FCM_CONFIGURED', firebaseConfigured.toString()
    }
    flavorDimensions "app"
    productFlavors {
        admin {
            dimension "app"
            applicationId "app.hhyyw.admin"
            buildConfigField 'String', 'APP_SCOPE', '"admin"'
            manifestPlaceholders = [appName: "الإدارة", startUrl: appOrigin + "/admin", host: appHost, pathPrefix: "/admin"]
            resValue "string", "app_name", "الإدارة"
        }
        captain {
            dimension "app"
            applicationId "app.hhyyw.captain"
            buildConfigField 'String', 'APP_SCOPE', '"captain"'
            manifestPlaceholders = [appName: "كابتن التوصيل", startUrl: appOrigin + "/captain", host: appHost, pathPrefix: "/captain"]
            resValue "string", "app_name", "كابتن التوصيل"
        }
    }
    buildTypes { release { minifyEnabled false } }
    buildFeatures { buildConfig true }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets { main.assets.srcDir(layout.buildDirectory.dir('generated/offlineAssets')) }
}
tasks.register('prepareOfflineAssets', Sync) {
    from(rootProject.file('../dist'))
    exclude('owner*', 'account-setup*')
    into(layout.buildDirectory.dir('generated/offlineAssets/offline'))
    doFirst { if (!rootProject.file('../dist/offline-shell-manifest.json').exists()) throw new GradleException('Run npm run build before building Android') }
}
tasks.named('preBuild').configure { dependsOn('prepareOfflineAssets') }
dependencies {
    implementation 'androidx.webkit:webkit:1.8.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'com.google.firebase:firebase-messaging:24.1.2'
    implementation 'androidx.work:work-runtime:2.9.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'org.mockito:mockito-core:4.11.0'
}
