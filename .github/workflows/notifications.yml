name: Check notification flow
on:
  push:
    branches: [main]
    paths: ['auth-session.js', 'app-refresh*', 'push*.js', 'native-push.js', 'mobile*', 'admin-mobile*', 'admin-workspace*', 'admin-motion*', 'sw.js', 'captain.html', 'admin.html', 'manifest-*.json', 'android/**', 'supabase/**', 'tests/**', 'scripts/**', 'package*.json', 'netlify.toml', '.github/workflows/notifications.yml']
  pull_request:
    paths: ['auth-session.js', 'app-refresh*', 'push*.js', 'native-push.js', 'mobile*', 'admin-mobile*', 'admin-workspace*', 'admin-motion*', 'sw.js', 'captain.html', 'admin.html', 'manifest-*.json', 'android/**', 'supabase/**', 'tests/**', 'scripts/**', 'package*.json', 'netlify.toml', '.github/workflows/notifications.yml']
permissions:
  contents: read
jobs:
  notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 tests/check_android_notifications.py
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: node tests/notifications-browser.cjs
      - run: node tests/mobile-browser.cjs
      - run: node tests/admin-mobile-browser.cjs
      - run: node tests/admin-workspace-browser.cjs
      - run: node tests/admin-motion-browser.cjs
      - run: node tests/refresh-browser.cjs
      - run: node tests/auth-browser.cjs
      - run: node tests/diagnostics-browser.cjs
      - run: node tests/native-host-browser.cjs
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: browser-failure-screenshots, path: test-results/ }
