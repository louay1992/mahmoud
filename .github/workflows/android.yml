name: Build Android apps
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build release (unsigned)
        working-directory: android
        run: gradle --no-daemon assembleAdminRelease assembleCaptainRelease
      - name: Collect
        run: |
          mkdir out
          cp android/app/build/outputs/apk/admin/release/*.apk out/admin-unsigned.apk
          cp android/app/build/outputs/apk/captain/release/*.apk out/captain-unsigned.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp $BT/lib/apksigner.jar out/
          $BT/zipalign -c -p 4 out/admin-unsigned.apk && echo aligned-admin
          $BT/aapt2 dump badging out/admin-unsigned.apk | head -5 > out/admin-badging.txt || true
      - uses: actions/upload-artifact@v4
        with: { name: apk-unsigned, path: out/ }
