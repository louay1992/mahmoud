name: Build Android apps
on:
  push:
    paths: ['android/**', 'offline-*', 'vendor/**', 'scripts/build-web.cjs', 'app-updates*', 'app-config.js', 'admin.html', 'captain.html', 'admin.css', 'admin-app.js', 'account-setup*', 'admin-email*', 'admin-subscription*', 'subscription-*.js', 'subscription-*.css', 'captain.css', 'captain-app.js', '.github/workflows/android.yml']
  # Required native tests must also run on every PR to main.
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '24' }
      - name: Prepare bundled offline interface
        run: node scripts/build-web.cjs
      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Test native host and notifications and build release (unsigned)
        working-directory: android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json; fi
          gradle --no-daemon testAdminDebugUnitTest testCaptainDebugUnitTest
          if [ -f app/google-services.json ]; then gradle --no-daemon assembleAdminRelease assembleCaptainRelease; fi
      - name: Collect
        if: ${{ hashFiles('android/app/google-services.json') != '' }}
        run: |
          mkdir out
          cp android/app/build/outputs/apk/admin/release/*.apk out/admin-unsigned.apk
          cp android/app/build/outputs/apk/captain/release/*.apk out/captain-unsigned.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          cp $BT/lib/apksigner.jar out/
          $BT/zipalign -c -p 4 out/admin-unsigned.apk && echo aligned-admin
          $BT/aapt2 dump badging out/admin-unsigned.apk | head -5 > out/admin-badging.txt || true
          $BT/aapt2 dump badging out/captain-unsigned.apk | head -5 > out/captain-badging.txt || true
          git rev-parse HEAD > out/SOURCE_COMMIT.txt
          (cd out && sha256sum admin-unsigned.apk captain-unsigned.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/google-services.json') != '' }}
        with: { name: apk-unsigned, path: out/ }
      - name: Publish unsigned build to apk-build branch
        if: github.ref == 'refs/heads/main' && hashFiles('android/app/google-services.json') != ''
        run: |
          cd out && git init -q -b apk-build && git config user.name ci && git config user.email ci@example.com
          git add -A && git commit -qm "unsigned build" 
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk-build
