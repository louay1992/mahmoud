<body>
<div id="splash"><div class="logo"><svg class="i" viewBox="0 0 24 24" style="fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></div><b>إدارة كباتن التوصيل</b><div class="spin"></div></div>
<div id="bar"></div><div id="offline">لا يوجد اتصال بالإنترنت — سيتم التحديث عند عودته</div>

<div id="login">
  <div class="hero"><div class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg></div>
    <h1>لوحة الإدارة</h1><p>سجّل دخولك لإدارة الطلبات والكباتن</p></div>
  <div class="panel"><div class="in">
    <div class="fld"><span id="i_mail"></span><input id="em" type="email" placeholder="البريد الإلكتروني" dir="ltr" autocomplete="username" inputmode="email"></div>
    <div class="fld"><span id="i_lock"></span><input id="pw" type="password" placeholder="كلمة المرور" dir="ltr" autocomplete="current-password"><button class="eye" type="button" id="eye" aria-label="إظهار كلمة المرور"></button></div>
    <button class="b btn-block" id="lbtn" onclick="login()">دخول</button>
    <button type="button" id="admin-forgot-password">نسيت كلمة المرور؟</button>
    <p id="admin-account-ready" class="admin-email-ready" role="status" hidden></p>
  </div></div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="av" id="hav"></div>
    <div class="tt"><b id="hn">إدارة كباتن التوصيل</b><span>لوحة الإدارة</span></div>
    <button class="ib" id="bell" onclick="go('notifs')" aria-label="الإشعارات"></button>
    <button class="ib" id="rf" onclick="manualRefresh()" aria-label="تحديث"></button>
    <button class="ib" id="lo" onclick="logout()" aria-label="خروج"></button>
  </header>
  <aside id="side"></aside>
  <main id="main"></main>
  <nav id="bnav"><div class="row" id="bnr"></div></nav>
</div>
<div id="upd"></div>
<div id="modal" onclick="if(event.target===this)closeStatus()"></div>
<div id="toast"></div>

<script src="/subscription-utils.js"></script>
<script src="/admin-subscription.js"></script>
<script src="/admin-email.js"></script>
<script src="/admin-app.js"></script>
