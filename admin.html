<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>الإدارة - كباتن التوصيل</title>
<link rel="manifest" href="/manifest-admin.json">
<link rel="icon" href="/icons/admin-192.png">
<link rel="apple-touch-icon" href="/icons/admin-apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --p:#0f766e;--p2:#134e4a;--p3:#14b8a6;--bg:#eef3f4;--card:#fff;--bd:#e1e9ec;--tx:#0f172a;--mut:#64748b;
  --red:#ef4444;--grn:#16a34a;--amb:#f59e0b;--r:16px;--sh:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,118,110,.08);
  --top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px);--side:244px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-.22em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(20,184,166,.5);outline-offset:2px}

#splash{position:fixed;inset:0;z-index:200;background:linear-gradient(160deg,#134e4a,#0f766e 55%,#2dd4bf);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;color:#fff;transition:opacity .4s,visibility .4s}
#splash.off{opacity:0;visibility:hidden}
#splash .logo{width:92px;height:92px;border-radius:26px;background:rgba(255,255,255,.16);display:grid;place-items:center;animation:float 2.4s ease-in-out infinite}
#splash .logo svg{width:52px;height:52px}
#splash b{font-size:22px}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}@keyframes float{50%{transform:translateY(-8px)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes zoom{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}

#login{min-height:100vh;min-height:100dvh;display:none;flex-direction:column;background:linear-gradient(165deg,#134e4a 0%,#0f766e 55%,#2dd4bf 100%)}
#login .hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;padding:calc(var(--top) + 30px) 20px 10px;text-align:center}
#login .hero .badge{width:96px;height:96px;border-radius:28px;background:rgba(255,255,255,.16);display:grid;place-items:center;animation:float 3s ease-in-out infinite}
#login .hero .badge svg{width:54px;height:54px}
#login .hero h1{margin:16px 0 4px;font-size:28px}#login .hero p{margin:0;opacity:.85}
#login .panel{background:#fff;border-radius:28px 28px 0 0;padding:24px 20px calc(24px + var(--bot));box-shadow:0 -10px 40px rgba(0,0,0,.18);animation:sheet .5s cubic-bezier(.2,.9,.3,1) both}
#login .panel .in{max-width:420px;margin:0 auto}
@media(min-width:760px){#login{align-items:center;justify-content:center}#login .hero{flex:none;padding-bottom:20px}#login .panel{border-radius:28px;width:440px}}
.fld{position:relative;margin-bottom:12px}
.fld input{width:100%;padding:15px 14px;padding-inline-start:46px;border:1.5px solid var(--bd);border-radius:14px;font:inherit;background:#f8fbfb}
.fld input:focus{outline:none;border-color:var(--p);background:#fff;box-shadow:0 0 0 4px rgba(15,118,110,.12)}
.fld>span{position:absolute;inset-inline-start:15px;top:50%;transform:translateY(-50%);color:var(--mut);display:flex;pointer-events:none}
.fld .eye{position:absolute;inset-inline-end:8px;top:50%;transform:translateY(-50%);border:0;background:none;padding:8px;color:var(--mut);cursor:pointer}
.fld:has(.eye) input{padding-inline-end:46px}

header{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#134e4a,#0f766e 65%,#14b8a6);color:#fff;padding:calc(var(--top) + 11px) 14px 13px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px rgba(15,118,110,.3);border-radius:0 0 22px 22px}
header .av{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.18);display:grid;place-items:center;flex:none}
header .tt{flex:1;min-width:0}
header .tt b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .tt span{display:block;font-size:12.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:13px;border:0;background:rgba(255,255,255,.16);color:#fff;display:grid;place-items:center;cursor:pointer;position:relative;transition:transform .15s,background .2s}
.ib:active{transform:scale(.9);background:rgba(255,255,255,.28)}
.ib .dot{position:absolute;top:8px;inset-inline-end:9px;width:9px;height:9px;border-radius:50%;background:#fbbf24;border:2px solid #0f766e}
.ib.on .dot{display:none}.ib.sp svg{animation:rot .8s linear infinite}
#bar{position:fixed;top:0;inset-inline:0;height:3px;z-index:99;background:linear-gradient(90deg,transparent,#fbbf24,transparent);background-size:50% 100%;background-repeat:no-repeat;opacity:0;transition:opacity .2s}
#bar.on{opacity:1;animation:bar 1s linear infinite}@keyframes bar{from{background-position:-50% 0}to{background-position:150% 0}}
#offline{position:fixed;top:0;inset-inline:0;z-index:120;background:#b45309;color:#fff;text-align:center;padding:calc(var(--top) + 6px) 10px 6px;font-size:13.5px;font-weight:700;transform:translateY(-110%);transition:transform .3s}
#offline.on{transform:none}

main{max-width:1080px;margin:0 auto;padding:16px 14px calc(100px + var(--bot))}
.anim .card,.anim .stat,.anim .whcard,.anim .grp{animation:up .4s cubic-bezier(.2,.8,.3,1) both}
.anim .stat:nth-child(2){animation-delay:.04s}.anim .stat:nth-child(3){animation-delay:.08s}.anim .stat:nth-child(4){animation-delay:.12s}

/* التنقل: شريط سفلي في الجوال، شريط جانبي في الشاشات الكبيرة */
#bnav{position:fixed;bottom:0;inset-inline:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid var(--bd);display:flex;justify-content:center;padding:6px 8px calc(6px + var(--bot));box-shadow:0 -6px 24px rgba(15,23,42,.06)}
#bnav .row{display:flex;width:100%;max-width:560px;gap:2px;margin:0}
#bnav button{flex:1;border:0;background:none;padding:6px 2px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:11.5px;font-weight:700;cursor:pointer;position:relative;transition:color .2s,background .2s,transform .15s}
#bnav button svg.i{width:23px;height:23px;transition:transform .25s}
#bnav button.on{color:var(--p);background:#e3f6f3}#bnav button.on svg.i{transform:translateY(-2px) scale(1.12)}
#bnav button:active{transform:scale(.94)}
#bnav button.fab{flex:0 0 58px}#bnav button.fab .pl{width:48px;height:48px;border-radius:16px;margin-top:-20px;background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff;display:grid;place-items:center;box-shadow:0 8px 18px rgba(15,118,110,.4)}
#bnav button.fab.on{background:none}
.bd{position:absolute;top:0;inset-inline-end:calc(50% - 25px);min-width:19px;height:19px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px;animation:pop .35s;font-style:normal}
#side{display:none}
@media(min-width:900px){
  #bnav{display:none}
  #side{display:flex;flex-direction:column;gap:4px;position:fixed;top:calc(var(--top) + 84px);bottom:16px;inset-inline-start:14px;width:calc(var(--side) - 14px);background:#fff;border-radius:20px;padding:12px;box-shadow:var(--sh);z-index:20;overflow:auto}
  #side button{display:flex;align-items:center;gap:12px;border:0;background:none;padding:12px 14px;border-radius:14px;cursor:pointer;color:var(--mut);font-weight:700;text-align:start;transition:background .2s,color .2s;position:relative}
  #side button:hover{background:#f1f6f7}#side button.on{background:linear-gradient(135deg,#e3f6f3,#d3f1ec);color:var(--p)}
  #side .bd{position:static;margin-inline-start:auto;animation:none}
  main{margin-inline-start:calc(var(--side) + 14px);margin-inline-end:auto;max-width:none;padding-bottom:40px}
  header{border-radius:0 0 22px 22px}
}

/* الأزرار */
button.b,a.b{border:0;border-radius:13px;padding:11px 18px;min-height:44px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,box-shadow .2s;text-decoration:none;color:#fff;background:linear-gradient(135deg,#0f766e,#14b8a6);box-shadow:0 5px 14px rgba(15,118,110,.28);font-size:15px}
button.b:active,a.b:active{transform:scale(.96)}
button.b.s,a.b.s{min-height:36px;padding:6px 12px;font-size:13.5px;border-radius:11px;box-shadow:none}
button.b.r{background:linear-gradient(135deg,#dc2626,#ef4444);box-shadow:0 5px 14px rgba(220,38,38,.25)}
button.b.g,a.b.g{background:linear-gradient(135deg,#16a34a,#22c55e);box-shadow:0 5px 14px rgba(22,163,74,.25)}
button.b.o,a.b.o{background:#fff;color:var(--p);border:1.5px solid #bfe3df;box-shadow:none}
button.b.s.g,a.b.s.g,button.b.s.r{box-shadow:none}
button:disabled{opacity:.5;cursor:not-allowed}
.btn-block{width:100%}
button.b.load::after{content:"";width:18px;height:18px;border:2.5px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:rot .7s linear infinite}

/* البطاقات والحقول */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid rgba(225,233,236,.8)}
.card h2{font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.card h3{font-size:15.5px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.row>*{flex:1 1 150px}
input,select,textarea{width:100%;padding:12px 13px;border:1.5px solid var(--bd);border-radius:13px;font:inherit;background:#f8fbfb;color:var(--tx);transition:border .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--p);background:#fff;box-shadow:0 0 0 4px rgba(15,118,110,.12)}
input[type=checkbox]{width:auto}
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:right;vertical-align:middle}
th{color:var(--mut);font-weight:700;font-size:13px;background:#f6fafa;position:sticky;top:0}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto;border-radius:12px;-webkit-overflow-scrolling:touch}
.tag{display:inline-flex;align-items:center;padding:3px 11px;border-radius:20px;font-size:12.5px;font-weight:700;color:#fff;white-space:nowrap}
.new{background:#64748b}.assigned{background:var(--amb)}.delivered{background:var(--grn)}.cancelled{background:var(--red)}.returned{background:#7c3aed}.in_delivery{background:#2563eb}.no_answer{background:#ea580c}.closed{background:#475569}.other{background:#0891b2}
.neg{color:var(--red);font-weight:700}.mut{color:var(--mut);font-size:13.5px}.big{font-size:22px;font-weight:800}
.up{color:#16a34a}.dn{color:#dc2626}
.pg{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.pg h2{margin:0;font-size:19px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.stat{background:#fff;border-radius:var(--r);padding:14px;cursor:pointer;box-shadow:var(--sh);transition:transform .15s;display:flex;flex-direction:column;gap:2px}
.stat:active{transform:scale(.97)}.stat .ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;margin-bottom:6px}
.stat .big{font-size:23px}

.empty{text-align:center;padding:28px 10px;color:var(--mut,#64748b)}.empty b{display:block;color:#0f172a;margin-bottom:4px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px}.dno{font-size:20px;font-weight:800}
.dsec{background:#f6faf9;border:1px solid #e1ecea;border-radius:14px;padding:12px 14px;margin:10px 0}.dh{font-weight:800;color:var(--p);margin-bottom:8px;font-size:15px}
.dr{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed #e1ecea}.dr:last-of-type{border-bottom:0}.dl{color:#64748b}.dv2{text-align:end;font-weight:600}
.dit{display:grid;grid-template-columns:1fr 52px 70px 80px;gap:6px;padding:6px 0;border-bottom:1px dashed #e1ecea;align-items:center}.dit .dq,.dit .dp,.dit .ds{text-align:center}.dit .ds{font-weight:700}.dhd{font-size:12px;color:#64748b;font-weight:700}
.dtot{margin-top:8px;display:grid;gap:4px}.dtot div{display:flex;justify-content:space-between}.dtot .g{font-size:17px;font-weight:800;border-top:2px solid #cfe3df;padding-top:6px;margin-top:2px}
.dnote{background:#fff;border-inline-start:4px solid #0f766e;border-radius:10px;padding:8px 10px;margin-bottom:8px}.dnote.cap{border-color:#f59e0b;background:#fffbeb}.dnote b{display:block;font-size:13px;color:#475569}.dnote small{color:#94a3b8}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;overflow-x:auto}
.chip{background:#fff;border:1.5px solid var(--bd);border-radius:20px;padding:6px 14px;font-size:14px;cursor:pointer;font-weight:600;transition:transform .12s,background .2s;white-space:nowrap}
.chip:active{transform:scale(.95)}.chip.on{background:var(--p);color:#fff;border-color:var(--p)}.chip b{margin-inline-start:4px}

.grp,.sub{background:#fff;border-radius:var(--r);margin-bottom:12px;box-shadow:var(--sh);border:1px solid rgba(225,233,236,.8)}
.grp>summary,.sub>summary{padding:13px 14px;cursor:pointer;font-weight:700;display:flex;align-items:center;gap:8px;list-style:none}
.grp>summary::-webkit-details-marker,.sub>summary::-webkit-details-marker{display:none}
.grp>summary .n,.sub .n{margin-inline-start:auto;background:#eef3f4;border-radius:12px;padding:1px 11px;font-size:13.5px}
.grp .inner,.sub .inner{padding:0 10px 6px}.grp .card{background:#fafcfc;box-shadow:none}
.sub{box-shadow:none;margin:8px 0}
.cap>summary{background:#f4f9f9;border-radius:var(--r)}
.cap .badges{display:flex;gap:6px;flex-wrap:wrap;margin-inline-start:auto}
.cap .badges span{font-size:12px;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:1px 8px;font-weight:600}

.whgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.whcard{background:#fff;border-radius:var(--r);padding:16px;cursor:pointer;box-shadow:var(--sh);border:1.5px solid transparent;transition:transform .15s,border .2s}
.whcard:hover{border-color:var(--p3)}.whcard:active{transform:scale(.98)}
.whn{font-weight:800;font-size:17px;margin-bottom:2px}
.whs{display:flex;justify-content:space-between;margin-top:12px;text-align:center}
.whs b{display:block;font-size:21px}.whs span{font-size:12px;color:var(--mut)}

.htab td,.htab th{white-space:nowrap}
.htab td.pd{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.htab tr.rw{cursor:pointer;transition:background .15s}.htab tr.rw:hover{background:#f1f8f8}
.htab tr.gh td{background:#e8f4f2;font-weight:800;cursor:default}
.nt{max-width:170px;overflow:hidden;text-overflow:ellipsis;color:var(--mut);font-size:13px}

.note{margin:8px 0;padding:10px 12px;border-radius:12px;background:#fff8eb;border:1px solid #fde4b3;font-size:14px}
.tl{margin:8px 0;font-size:13px;color:var(--mut)}.tl summary{cursor:pointer;font-weight:700}.tl div{padding:5px 0;border-top:1px dashed var(--bd)}
.items .row{align-items:center;background:var(--bg,#f1f5f4);border-radius:14px;padding:8px;gap:8px;flex-wrap:wrap}.items .row select{flex:1 1 100%}.items .row input{flex:1 1 0;min-width:0;max-width:none!important}.items .row .dv{flex:1 1 auto!important;text-align:center}

/* بطاقة الطلب */
.card.oc{border-inline-start:5px solid var(--sc,#94a3b8)}
.s-new{--sc:#64748b}.s-assigned{--sc:#f59e0b}.s-in_delivery{--sc:#2563eb}.s-no_answer{--sc:#ea580c}.s-closed{--sc:#475569}.s-other{--sc:#0891b2}.s-delivered{--sc:#16a34a}.s-cancelled{--sc:#ef4444}.s-returned{--sc:#7c3aed}

/* النوافذ */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:60;animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:10px 18px calc(18px + var(--bot));max-height:92vh;max-height:92dvh;overflow:auto;animation:sheet .35s cubic-bezier(.2,.9,.3,1)}
.sheet::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:#d5dbe7;margin:0 auto 12px}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:17px}
.x{border:0;background:#f1f5f9;border-radius:50%;width:38px;height:38px;cursor:pointer;display:grid;place-items:center;transition:transform .15s;font-size:16px}
.x:active{transform:scale(.88)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.opt{display:flex;align-items:center;gap:10px;padding:14px 12px;border:2px solid var(--bd);border-radius:15px;background:#fff;cursor:pointer;text-align:start;font-weight:600;transition:transform .12s,border .2s,background .2s}
.opt:active{transform:scale(.96)}.opt span{font-size:20px}.opt.sel{border-color:var(--p);background:#e8f7f5;font-weight:800}
.dlg{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px;animation:fade .2s}
.dlg>div{background:#fff;border-radius:24px;padding:22px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:zoom .25s cubic-bezier(.2,.9,.3,1.2)}
.dlg .di{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;margin:0 auto 10px;color:#fff;background:var(--dc,var(--grn))}
.dlg h3{margin:0 0 8px;text-align:center;font-size:19px}.dlg .bd2{text-align:center;line-height:1.8;margin-bottom:16px}
.dlg .btns{display:flex;gap:10px;flex-wrap:wrap}.dlg .btns .b{flex:1 1 120px}
.frm label{display:block;font-size:13px;color:var(--mut);font-weight:700;margin:0 0 4px}.frm .f{margin-bottom:12px}

#toast{position:fixed;bottom:calc(92px + var(--bot));left:50%;transform:translate(-50%,30px);background:#0f172a;color:#fff;padding:12px 18px;border-radius:30px;font-size:14.5px;display:flex;align-items:center;gap:8px;z-index:150;opacity:0;pointer-events:none;transition:.3s;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.3)}
#toast.on{opacity:1;transform:translate(-50%,0)}#toast.err{background:#b91c1c}#toast.ok{background:#15803d}
@media(min-width:900px){#toast{bottom:28px}}
.banner{display:flex;align-items:center;gap:10px;border-radius:var(--r);padding:12px 14px;margin-bottom:12px;color:#fff;box-shadow:var(--sh);animation:up .4s both}
.banner b{display:block}.banner span{font-size:13px;opacity:.92}
.banner .b{margin-inline-start:auto;background:#fff;color:var(--p);min-height:40px;font-size:14px;white-space:nowrap;box-shadow:none}
.banner.n{background:linear-gradient(135deg,#7c3aed,#6366f1)}.banner.u{background:linear-gradient(135deg,#16a34a,#10b981)}
#upd{position:fixed;inset-inline:12px;bottom:calc(88px + var(--bot));z-index:90;display:none;max-width:560px;margin:0 auto}
.more{display:grid;gap:10px}
.more button{display:flex;align-items:center;gap:12px;border:0;background:#f4f9f9;border-radius:15px;padding:14px;font-weight:700;cursor:pointer;text-align:start}
.more button svg{color:var(--p)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media print{header,#bnav,#side,#toast,#bar{display:none!important}main{margin:0!important;padding:0!important}}

const ic = (n, cls="") => `<svg class="i ${cls}" viewBox="0 0 24 24">${IC[n]||""}</svg>`;
let toastT;
function toast(m, kind){ const t=$("toast"); if(!kind&&/^(خطأ|فشل|غير|اكتب|أدخل|اختر|سعر غير|كمية غير|مبلغ غير|كلمة المرور قصيرة|لم تغيّر|أضف)/.test(m)) kind="err";
  t.className=kind||""; t.innerHTML=(kind==="err"?ic("xc"):kind==="ok"?ic("checkc"):kind==="bell"?ic("bell"):"")+`<span>${esc(m)}</span>`; requestAnimationFrame(()=>t.classList.add("on")); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),3400) }
let busy=0, lastSelf=0;
async function run(p, ok){ busy++; $("bar").classList.add("on"); lastSelf=Date.now();
  try{ const {error}=await p; if(error){toast("خطأ: "+error.message,"err");return false} if(ok)toast(ok,"ok"); return true }
  finally{ if(--busy<=0){ busy=0; $("bar").classList.remove("on") } } }

/* ===== نوافذ الحوار (بديل confirm/prompt) ===== */
function dlgShell(inner){ const d=document.createElement("div"); d.className="dlg"; d.innerHTML=`<div>${inner}</div>`; document.body.appendChild(d); return d }
function askc(msg,o={}){
  return new Promise(res=>{
    const col=o.cls==="r"?"#ef4444":"#16a34a";
    const d=dlgShell(`<div class="di" style="--dc:${col}">${ic(o.cls==="r"?"alert":"checkc")}</div><h3>${o.title||"تأكيد"}</h3><div class="bd2">${msg}</div><div class="btns"><button class="b ${o.cls||"g"}" id="dk">${o.ok||"تأكيد"}</button><button class="b o" id="dc">${o.cancel||"إلغاء"}</button></div>`);
    const done=v=>{d.remove();res(v)}; d.querySelector("#dk").onclick=()=>done(true); d.querySelector("#dc").onclick=()=>done(false); d.onclick=e=>{if(e.target===d)done(false)};
  });
}
function ask3(msg,o){ // true / false / null
  return new Promise(res=>{
    const d=dlgShell(`<div class="di" style="--dc:#0f766e">${ic("box")}</div><h3>${o.title}</h3><div class="bd2">${msg}</div><div class="btns"><button class="b g" id="d1">${o.yes}</button><button class="b r" id="d2">${o.no}</button><button class="b o" id="d3">إلغاء</button></div>`);
    const done=v=>{d.remove();res(v)}; d.querySelector("#d1").onclick=()=>done(true); d.querySelector("#d2").onclick=()=>done(false); d.querySelector("#d3").onclick=()=>done(null);
  });
}
function askf(title,fields,ok="حفظ",o={}){
  return new Promise(res=>{
    const d=dlgShell(`<h3>${title}</h3>${o.msg?`<div class="bd2">${o.msg}</div>`:""}<div class="frm">${fields.map((f,i)=>`<div class="f"><label>${f.l}</label>${f.area?`<textarea id="ff${i}" rows="3" placeholder="${esc(f.ph||"")}">${esc(f.v??"")}</textarea>`:`<input id="ff${i}" type="${f.t||"text"}" ${f.t==="number"?'step="0.01" inputmode="decimal"':""} ${f.dir?`dir="${f.dir}"`:""} placeholder="${esc(f.ph||"")}" value="${esc(f.v??"")}">`}</div>`).join("")}</div>
      <div class="btns"><button class="b ${o.cls||""}" id="dk">${ok}</button><button class="b o" id="dc">إلغاء</button></div>`);

    const first=d.querySelector("input,textarea"); first&&setTimeout(()=>first.focus(),50);
  });
}

function hideSplash(){ $("splash").classList.add("off") }
function showLogin(){ $("app").style.display="none"; $("login").style.display="flex"; hideSplash() }
async function boot(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ showLogin(); return }
  ME = (session.user.email || "").toLowerCase();
  const {data:acc} = await sb.rpc("my_access");
  if(!acc || acc.role==="none"){ toast("هذا الحساب ليس إدارياً","err"); await sb.auth.signOut(); showLogin(); return }
  ACC=acc;
  $("login").style.display="none"; $("app").style.display="block";
  if(ACC.role==="staff"){
    $("bell").style.display="none";
    if(!visTabs().length){ toast("لا توجد صلاحيات مفعّلة لهذا الحساب","err"); await sb.auth.signOut(); showLogin(); return }
    await loadAll(true); renderNav(); go(visTabs()[0][0]); hideSplash(); checkUpdate(); return }
  await loadAll(true); renderNav(); go("home"); hideSplash(); startLive(); initNotifUI(); ensurePush(); checkUpdate();
}
async function login(){
  const b=$("lbtn"), em=$("em").value.trim(), pw=$("pw").value; if(!em||!pw) return toast("اكتب البريد وكلمة المرور","err");
  b.disabled=true; b.classList.add("load");
  const {error} = await sb.auth.signInWithPassword({email:em, password:pw});
  b.disabled=false; b.classList.remove("load");
  if(error) return toast("فشل الدخول: تحقق من البيانات","err");
  $("splash").classList.remove("off"); boot();
}
async function logout(){ if(!await askc("هل تريد الخروج من حسابك؟",{title:"تسجيل الخروج",ok:"نعم، خروج",cls:"r"})) return; await dropPush(); await sb.auth.signOut(); location.reload() }

    sb.from("settings").select("*") ]);
  [lk,od].forEach(x=>x.error&&toast("خطأ تحميل: "+x.error.message));
  const L=lk.data||{}; D.products=L.products||[]; D.captains=L.captains||[]; D.marketers=L.marketers||[]; D.warehouses=L.warehouses||[]; D.orders=od.data||[];
  D.settings=Object.fromEntries((st.data||[]).map(x=>[x.key,x.value])); CUR=D.settings.currency||"";
  const biz=D.settings.business_name||"إدارة كباتن التوصيل"; $("hn").textContent=biz; document.title=biz;

  const f=await askf("تعديل المسوّقة",[{k:"name",l:"الاسم",v:m.name},{k:"gov",l:"المحافظة",v:m.governorate||""},{k:"phone",l:"الموبايل",v:m.phone||"",dir:"ltr"}]); if(!f) return;
  if(!f.name.trim()) return toast("الاسم مطلوب","err");
  if(await run(sb.from("marketers").update({name:f.name.trim(),governorate:f.gov.trim()||null,phone:f.phone.trim()||null}).eq("id",id),"تم الحفظ")) refresh();
}
async function toggleMarketer(id,v){ if(await run(sb.from("marketers").update({active:v}).eq("id",id))) refresh() }

let MF={q:"",f:"all",g:""};
const mkRows=()=>{
  const q=MF.q.trim().toLowerCase();
  return D.mbal.filter(b=>{
    const m=D.marketers.find(x=>x.id===b.marketer_id)||{};
    if(MF.g&&m.governorate!==MF.g) return false;
    const bal=Number(b.balance), has=Number(b.earned)>0||Number(b.paid)>0||Number(b.delivered_count)>0;
    if(MF.f==="due"&&!(bal>0.004)) return false;
    if(MF.f==="settled"&&!(has&&Math.abs(bal)<0.005)) return false;
    if(MF.f==="pending"&&!(Number(b.pending)!==0)) return false;
    if(MF.f==="none"&&has) return false;
    if(q&&![b.name,m.governorate,m.phone].some(v=>String(v||"").toLowerCase().includes(q))) return false;
    return true;
  });
};

async function payMarketer(id){
  const m=D.marketers.find(x=>x.id===id), b=D.mbal.find(x=>x.marketer_id===id)||{};
  const f=await askf("تسديد دفعة للمسوّقة "+m.name,[{k:"a",l:"المبلغ (المتبقي لها "+money(b.balance||0)+")",t:"number",ph:"0"},{k:"n",l:"ملاحظة (اختياري)"}],"تسجيل الدفعة"); if(!f) return;
  const amount=parseFloat(f.a); if(isNaN(amount)||amount<=0) return toast("مبلغ غير صحيح","err");
  if(amount>Number(b.balance||0)+0.001 && !await askc("المبلغ أكبر من المتبقي لها ("+money(b.balance||0)+"). هل تريد المتابعة؟",{title:"تأكيد الدفعة",ok:"نعم، سجّل"})) return;
  if(await run(sb.from("marketer_payments").insert({marketer_id:id,amount,note:f.n.trim()||null}),"تم تسجيل الدفعة")) refresh();
}

const capEmail=(ph,old)=>{ const k=normPh(ph); const o=String(old||"").toLowerCase(); if(o&&!o.endsWith("@captain.local")) return o; return k?k+"@captain.local":null };
async function addCaptain(){
  const name=$("cn").value.trim(); if(!name) return toast("أدخل الاسم");
  const rec={name, phone:$("cph").value.trim()||null, email:capEmail($("cph").value), delivery_fee:parseFloat($("cf").value)||0};
  const pw=($("cpw").value||"").trim();
  if(pw&&(pw.length<6||!rec.email)) return toast("كلمة المرور 6 أحرف على الأقل، ويلزم رقم موبايل","err");
  const {data,error}=await sb.from("captains").insert(rec).select("id").single();
  if(error) return toast(error.message,"err");
  if(pw){ try{ await callSetPw(data.id,pw); toast("تمت إضافة الكابتن وتعيين كلمة المرور","ok") }catch(e){ toast("أُضيف الكابتن لكن تعذّر تعيين كلمة المرور: "+e.message,"err") } } else toast("تمت الإضافة","ok");
  CV="list"; refresh();
}

async function setWhCaps(id,caps){
  const cur=D.captains.filter(c=>c.warehouse_id===id).map(c=>c.id);
  const rem=cur.filter(x=>!caps.includes(x)), add=caps.filter(x=>!cur.includes(x));
  if(rem.length&&!await run(sb.from("captains").update({warehouse_id:null}).in("id",rem))) return false;
  if(add.length&&!await run(sb.from("captains").update({warehouse_id:id}).in("id",add))) return false;
  return true;

const dsec=(t,body)=>`<div class="dsec"><div class="dh">${t}</div>${body}</div>`;
const drow=(l,v)=>v?`<div class="dr"><span class="dl">${l}</span><span class="dv2">${v}</span></div>`:"";
function orderDetail(o){
  const evs=D.ev[o.id]||[], pf=D.prof[o.id]||{}, diff=Number(o.items_total)-Number(o.list_total);
  const items=o.order_items.map(i=>`<div class="dit"><div class="din">${esc(i.products?.name)}</div><div class="dq">× ${i.qty}</div><div class="dp">${money(i.unit_price)}</div><div class="ds">${money(Number(i.unit_price)*i.qty)}</div></div>`).join("");
  const notes=(o.note?`<div class="dnote"><b>ملاحظة الإداري</b><div>${esc(o.note)}</div><small>بتاريخ ${when(noteAt(o))}</small></div>`:"")
    +(o.captain_note?`<div class="dnote cap"><b>ملاحظة الكابتن</b><div>${esc(o.captain_note)}</div><small>بتاريخ ${when(o.captain_note_at||o.status_at)}</small></div>`:"");
  return `<div class="dhead"><div><div class="dno">طلب #${o.order_no}</div><div class="mut">أُنشئ ${when(o.created_at)}</div></div>
      <div style="text-align:end"><span class="tag ${o.status}">${ST[o.status]}</span><div class="mut" style="font-size:12px;margin-top:3px">بتاريخ ${when(o.status_at||o.created_at)}</div></div></div>`
  +dsec("👤 الزبون",drow("الاسم",`<b>${esc(o.customer_name)}</b>`)+drow("الموبايل",`<a dir="ltr" href="tel:${esc(o.customer_phone)}">${esc(o.customer_phone)}</a>`)+drow("المحافظة",esc(o.governorate||""))+drow("العنوان",esc(o.customer_address||""))
    +`<div class="row" style="margin:8px 0 0"><a class="b s g" style="flex:0 0 auto;text-decoration:none" target="_blank" rel="noopener" href="${waUrl(o,waText(o))}">واتساب الزبون</a>${mapUrl(o)?`<a class="b s o" style="flex:0 0 auto;text-decoration:none" target="_blank" rel="noopener" href="${mapUrl(o)}">🗺 الخريطة</a>`:""}</div>`)
  +dsec("🚚 التوصيل",drow("الكابتن",o.captain_id?esc(cname(o.captain_id)):'<b style="color:#ea580c">لم يُسنَد بعد</b>')+drow("أجور التوصيل",money(o.delivery_fee)))
  +(o.marketer_id?dsec("🛍️ المسوّقة",drow("الاسم",`<b>${esc(mname(o.marketer_id))}</b>`)+drow("رأس المال",money(pf.capital||0))+drow("ربحها",`<b class="up">${money(pf.profit||0)}</b>${o.status==="delivered"?"":' <small class="mut">(تُستحق بعد التسليم)</small>'}`)):"")
  +dsec("📦 المنتجات",`<div class="dit dhd"><div class="din">المنتج</div><div class="dq">الكمية</div><div class="dp">السعر</div><div class="ds">المجموع</div></div>${items}
    <div class="dtot"><div>مجموع المنتجات <b>${money(o.items_total)}</b></div><div>أجور التوصيل <b>${money(o.delivery_fee)}</b></div><div class="g">المطلوب من الزبون <b>${money(o.total)}</b></div>
    ${diff?`<div class="${diff>0?"up":"dn"}">فرق عن السعر المثبت (${money(o.list_total)}): <b>${diff>0?"+":""}${money(diff)}</b></div>`:""}</div>`)
  +((D.pr[o.id]||[]).filter(x=>x.status==="pending").length?dsec("📝 بانتظار قرارك",(D.pr[o.id]||[]).filter(x=>x.status==="pending").map(prItem).join("")):"")
  +(notes?dsec("🗒️ الملاحظات",notes):"")
  +(evs.length>1?dsec("🕒 سجل الطلب",`<details class="tl"><summary>عرض السجل (${evs.length})</summary>${evs.map(e=>`<div><span class="tag ${e.status}">${ST[e.status]||e.status}</span> ${dt(e.created_at)}${e.note?" — "+esc(e.note):""}</div>`).join("")}</details>`):"")
  +dsec("⚙️ الإجراءات",orderActions(o));

function renderOrderList(){
  const base=ordBase(true), cnt={all:base.length}; base.forEach(o=>cnt[o.status]=(cnt[o.status]||0)+1);
  $("ochips").innerHTML=[["all","الكل"],...ORD_STATUS.map(k=>[k,ST[k]])].filter(([k])=>k==="all"||cnt[k]||orderFilter===k).map(([k,l])=>`<button class="chip ${orderFilter===k?"on":""}" onclick="orderFilter='${k}';renderOrderList()">${k==="all"?"":`<span style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${SCOL[k]};margin-inline-end:6px"></span>`}${l}<b>${cnt[k]||0}</b></button>`).join("");
  const list=ordBase(false), tot=list.reduce((a,o)=>a+Number(o.total),0);
  $("osum").innerHTML=`${list.length} طلب · الإجمالي: <b>${money(tot)}</b>`;
  if(!list.length){ $("olist").innerHTML='<div class="empty"><b>لا توجد طلبات مطابقة</b><span>غيّر الفلاتر أو اضغط «إعادة ضبط»</span></div>'; return }
  if(orderGrp==="none"){ $("olist").innerHTML=list.map(oc2).join(""); return }
  const keyOf={status:o=>o.status,captain:o=>o.captain_id||"-",marketer:o=>o.marketer_id||"-",day:o=>new Date(o.created_at).toLocaleDateString("ar-EG")}[orderGrp];
  const nameOf=k=>orderGrp==="status"?ST[k]:orderGrp==="captain"?(k==="-"?"غير مُسنَد":cname(k)):orderGrp==="marketer"?(k==="-"?"بدون مسوّقة":mname(k)):k;
  const g={}; list.forEach(o=>(g[keyOf(o)]=g[keyOf(o)]||[]).push(o));
  let keys=Object.keys(g); if(orderGrp==="status") keys.sort((x,y)=>ORD_STATUS.indexOf(x)-ORD_STATUS.indexOf(y));
  $("olist").innerHTML=keys.map(k=>{const l=g[k],sum=l.reduce((a,o)=>a+Number(o.total),0);
    return `<div class="row" style="justify-content:space-between;align-items:center;margin:14px 4px 8px"><h3 style="margin:0">${orderGrp==="status"?`<span style="display:inline-block;width:11px;height:11px;border-radius:50%;background:${SCOL[k]};margin-inline-end:8px"></span>`:""}${esc(nameOf(k))} <span class="mut">(${l.length})</span></h3><b>${money(sum)}</b></div>`+l.map(oc2).join("")}).join("");
}
async function restoreO(id){ if(!await askc("استرجاع هذا الطلب؟",{ok:"نعم، استرجاع"})) return;
  if(await run(sb.rpc("restore_order",{p_order:id,p_note:null}),"تم استرجاع الطلب")) refresh() }
async function returnO(id){
  try{
    const {data:imp}=await sb.rpc("marketer_return_impact",{p_order:id});
    if(imp&&imp.marketer&&Number(imp.profit)>0){
      const short=Number(imp.shortfall)>0.004;
      const ok=await askc(short
        ?`⚠️ <b>رصيد المسوّقة «${esc(imp.name)}» غير كافٍ لاسترجاع نسبتها من هذا الطلب.</b><br>ربحها من الطلب: <b>${money(imp.profit)}</b><br>رصيدها الحالي: <b>${money(imp.balance)}</b><br>النقص: <b>${money(imp.shortfall)}</b><br><br>إذا تابعتَ سيصبح رصيدها <b>${money(imp.after)}</b> (مبلغ مستحق عليها لك).`
        :`سيُخصم ربح المسوّقة «${esc(imp.name)}» من هذا الطلب (${money(imp.profit)}) من رصيدها.<br>رصيدها بعد الإرجاع: <b>${money(imp.after)}</b>`,
        {title:short?"رصيد المسوّقة غير كافٍ":"أثر الإرجاع على المسوّقة",ok:short?"متابعة رغم ذلك":"متابعة",cls:short?"r":""});
      if(!ok) return;
    }
  }catch(e){ console.warn(e) }
  const restock=await ask3("ستُلغى قيمة هذا الطلب من رصيد الكابتن.<br>هل البضاعة سليمة وتعود لمستودع الكابتن؟",{title:"إرجاع الطلب",yes:"سليمة — تعود للجرد",no:"تالفة — لا تعود"}); if(restock===null) return;
  if(await run(sb.rpc("return_order",{p_order:id,p_restock:restock,p_note:null}),"تم إرجاع الطلب")) refresh();
}
async function assign(id){ const c=$("as_"+id).value; if(!c) return toast("اختر كابتن");
  if(await run(sb.rpc("assign_order",{p_order:id,p_captain:c}),"تم الإسناد")) refresh() }
async function deliver(id){ if(!await askc("سيُخصم الجرد وتُسجَّل القيمة على الكابتن.",{title:"تأكيد التسليم",ok:"نعم، تم التسليم"})) return;
  if(await run(sb.rpc("deliver_order",{p_order:id}),"تم التسليم")) refresh() }
async function cancelO(id){ const f=await askf("إلغاء الطلب",[{k:"n",l:"سبب الإلغاء (اختياري)",area:1}],"إلغاء الطلب",{cls:"r"}); if(!f) return;
  if(await run(sb.rpc("cancel_order",{p_order:id,p_note:f.n.trim()||null}),"تم الإلغاء")) refresh() }

function priceDiffs(cid){
  const vc=v=>`<span class="${v>0?"up":v<0?"dn":""}">${v>0?"+":""}${money(v)}</span>`;
  const ords=D.orders.filter(o=>o.captain_id===cid&&o.status==="delivered"&&Number(o.items_total)!==Number(o.list_total));
  const reason=id=>{const e=(D.ev[id]||[]).filter(x=>(x.note||"").startsWith("تعديل أسعار")).pop();return e?esc(e.note.replace(/^تعديل أسعار:\s*/,"")):'<span class="mut">—</span>'};
  const tot=ords.reduce((a,o)=>a+Number(o.items_total)-Number(o.list_total),0);
  $("modal").innerHTML=`<div class="sheet" style="max-width:720px"><div class="sh-h"><b>فروقات الأسعار — ${esc(cname(cid))}</b><button class="x" onclick="closeStatus()">${ic("x")}</button></div>

  const secs={
    biz:`<div class="card"><h2>بيانات النشاط</h2>
    <div class="row"><input id="sb" placeholder="اسم النشاط" value="${esc(st.business_name)}"><input id="sc" placeholder="رمز العملة (د.أ)" value="${esc(st.currency)}"><input id="sl" type="number" min="0" placeholder="حد تنبيه المخزون المنخفض" value="${esc(st.low_stock)}"><input id="spc" placeholder="رمز الدولة للواتساب (مثال 963)" dir="ltr" value="${esc(st.phone_country||"963")}"></div>
    <button class="b" onclick="saveSettings()">حفظ</button></div>`,
    price:`<div class="card"><h2>حساب فروقات الأسعار</h2>
    <div class="row"><select id="spm"><option value="actual" ${st.price_mode!=="list"?"selected":""}>الفعلي: الكابتن يسلّمني ما قبضه فعلياً</option><option value="list" ${st.price_mode==="list"?"selected":""}>المثبت: الكابتن يسلّمني سعر المنتج المثبت (الزيادة له والنقص عليه)</option></select>
    <select id="sce"><option value="false" ${st.captain_can_edit_price!=="true"?"selected":""}>الإداري فقط يعدّل أسعار الطلبات</option><option value="true" ${st.captain_can_edit_price==="true"?"selected":""}>يُسمح للكابتن بتعديل السعر (بسبب إلزامي)</option></select></div>
    <p class="mut">يُطبَّق النمط على الطلبات التي تُسلَّم بعد الحفظ فقط؛ أما الطلبات المُسلَّمة سابقاً فيبقى مبلغها المطلوب كما حُسب وقت التسليم.</p>
    <button class="b" onclick="savePriceSettings()">حفظ</button></div>`,
    admins:`<div class="card"><h2>الحسابات الإدارية</h2>
    ${D.admins.map(a=>`<div style="display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #eef2f7"><div style="flex:1;min-width:0"><b>${esc(a.name||a.email)}</b><div class="mut" dir="ltr" style="text-align:start;font-size:12px">${esc(a.email)}</div>
      <div style="margin-top:4px">${a.perms?a.perms.map(p=>`<span class="tag" style="margin-inline-end:4px">${esc(PERM_L[p]||p)}</span>`).join("")||'<span class="mut">بلا صلاحيات</span>':'<span class="tag">إداري كامل</span>'}</div></div>
      ${a.email.toLowerCase()===ME?'<span class="mut">أنت</span>':`${a.perms?`<button class="b s o" onclick="editStaff('${esc(a.email)}')">الصلاحيات</button>`:""}<button class="b s o" onclick="staffPw('${esc(a.email)}')">كلمة مرور</button><button class="b s r" onclick="delAdmin('${esc(a.email)}')">حذف</button>`}</div>`).join("")}
    </div>
    <div class="card"><h2>إنشاء حساب إداري</h2>
    <div class="row"><input id="sn" placeholder="الاسم (للتمييز)"><input id="nae" type="email" dir="ltr" placeholder="البريد الإلكتروني"></div>
    <div class="row"><input id="spw" dir="ltr" placeholder="كلمة المرور (6 أحرف على الأقل)"></div>
    <div style="margin:8px 0"><label style="display:block;margin:4px 0"><input type="checkbox" id="sfull" onchange="document.getElementById('sperms').style.display=this.checked?'none':'block'"> إداري كامل (كل الصلاحيات)</label>
    <div id="sperms">${Object.entries(PERM_L).map(([k,l])=>`<label style="display:block;margin:4px 0"><input type="checkbox" class="sp" value="${k}" ${k==="create_orders"?"checked":""}> ${l}</label>`).join("")}</div></div>
    <button class="b" onclick="createStaff()">إنشاء الحساب</button>
    <p class="mut">الحساب بصلاحيات محدودة لا يرى رأس المال ولا الأرصدة ولا بقية الأقسام.</p></div>`,
    pw:`<div class="card"><h2>تغيير كلمة المرور</h2>
    <div class="row"><input id="np" type="password" dir="ltr" placeholder="كلمة المرور الجديدة (6 أحرف على الأقل)"><button class="b" style="flex:0 0 auto" onclick="changePw()">تغيير</button></div></div>`,
    danger:`<div class="card" style="border-color:var(--red)"><h2 style="color:var(--red)">منطقة الخطر</h2>
    <p class="mut">يمسح كل الطلبات والجرد والدفعات وسجل الحركة. يبقى المنتجات والكباتن والمستودعات. استخدمه بعد انتهاء التجربة فقط.</p>
    <button class="b r" onclick="resetData()">مسح البيانات التجريبية</button></div>`,
  };
  const meta=[["biz", "بيانات النشاط", "اسم النشاط والعملة وتنبيه المخزون", "store"], ["price", "حساب فروقات الأسعار", "نمط الحساب وصلاحية الكابتن", "tag"], ["admins", "الإداريون", "إضافة وحذف الإداريين", "users"], ["pw", "كلمة المرور", "تغيير كلمة مرور حسابك", "gear"], ["danger", "منطقة الخطر", "مسح البيانات التجريبية", "x"]];
  if(SSEC&&secs[SSEC]){
    const m=meta.find(x=>x[0]===SSEC);
    $("main").innerHTML=`<button class="b s o" style="margin-bottom:10px" onclick="SSEC=null;vSettings();scrollTo({top:0})">→ رجوع للإعدادات</button>`+secs[SSEC];
    return;
  }
  $("main").innerHTML=`<div class="card"><h2>الإعدادات</h2><div class="more" style="grid-template-columns:1fr">${meta.map(([k,t,d,i])=>`<button onclick="SSEC='${k}';vSettings();scrollTo({top:0})" style="flex-direction:row;justify-content:flex-start;gap:12px;text-align:right"><span>${ic(i)}</span><span style="display:flex;flex-direction:column;align-items:flex-start"><b>${t}</b><small class="mut">${d}</small></span></button>`).join("")}</div></div>`;
}
async function savePriceSettings(){
  if(await run(sb.from("settings").upsert([{key:"price_mode",value:$("spm").value},{key:"captain_can_edit_price",value:$("sce").value}]),"تم الحفظ")) refresh();
}
async function saveSettings(){
  const rows=[{key:"business_name",value:$("sb").value.trim()},{key:"currency",value:$("sc").value.trim()},{key:"low_stock",value:String(parseInt($("sl").value)||0)},{key:"phone_country",value:($("spc").value||"").replace(/\D/g,"")}];
  if(await run(sb.from("settings").upsert(rows),"تم الحفظ")) refresh();
}
const PERM_L={create_orders:"إنشاء طلبات",view_orders:"عرض الطلبات التي أنشأها",pick_captain:"اختيار الكابتن عند الإنشاء",pick_marketer:"اختيار المسوّقة عند الإنشاء"};
async function createStaff(){
  const email=$("nae").value.trim().toLowerCase(), name=$("sn").value.trim(), pw=$("spw").value;
  if(!/^\S+@\S+\.\S+$/.test(email)) return toast("بريد غير صالح","err");
  if(pw.length<6) return toast("كلمة المرور 6 أحرف على الأقل","err");
  const full=$("sfull").checked, perms=full?null:[...document.querySelectorAll(".sp:checked")].map(x=>x.value);
  if(!full&&!perms.length) return toast("اختر صلاحية واحدة على الأقل","err");
  if(full&&!await askc("سيُنشأ حساب إداري <b>كامل</b> يرى كل شيء بما فيه رأس المال والأرصدة. متأكد؟",{title:"إداري كامل",ok:"نعم",cls:"r"})) return;
  if(!await run(sb.from("admins").insert({email,name:name||null,perms}))) return;
  try{ await run2(callSetPw(null,pw,email)); toast("تم إنشاء الحساب. أعطه البريد وكلمة المرور","ok") }catch(e){ toast("أُضيف الحساب لكن تعذّر تعيين كلمة المرور: "+e.message,"err") }
  refresh();
}
function editStaff(email){
  const a=D.admins.find(x=>x.email===email); if(!a||!a.perms) return;
  const d=dlgShell(`<h3>صلاحيات ${esc(a.name||email)}</h3><div class="frm">${Object.entries(PERM_L).map(([k,l])=>`<label style="display:block;margin:8px 0"><input type="checkbox" class="ep" value="${k}" ${a.perms.includes(k)?"checked":""}> ${l}</label>`).join("")}</div>
    <div class="btns"><button class="b" id="dk">حفظ</button><button class="b o" id="dc">إلغاء</button></div>`);
  d.querySelector("#dc").onclick=()=>d.remove();
  d.querySelector("#dk").onclick=async()=>{ const perms=[...d.querySelectorAll(".ep:checked")].map(x=>x.value);
    if(!perms.length) return toast("اختر صلاحية واحدة على الأقل","err");
    d.remove(); if(await run(sb.from("admins").update({perms}).eq("email",email),"تم الحفظ")) refresh() };
}
async function staffPw(email){
  const f=await askf("كلمة مرور "+email,[{k:"p",l:"كلمة المرور الجديدة (6 أحرف على الأقل)",dir:"ltr"}],"تعيين"); if(!f) return;
  const p=f.p.trim(); if(p.length<6) return toast("كلمة المرور قصيرة","err");
  try{ await run2(callSetPw(null,p,email)); toast("تم تغيير كلمة المرور","ok") }catch(e){ toast(e.message,"err") }
}
async function delAdmin(email){ if(!await askc("حذف الإداري <b dir=\"ltr\">"+esc(email)+"</b>؟",{title:"حذف إداري",ok:"حذف",cls:"r"})) return;
  if(await run(sb.from("admins").delete().eq("email",email),"تم الحذف")) refresh() }
async function changePw(){
  const p=$("np").value; if(p.length<6) return toast("كلمة المرور قصيرة");
  if(await run(sb.auth.updateUser({password:p}),"تم تغيير كلمة المرور")) $("np").value="";
}
async function resetData(){
  const f=await askf("مسح البيانات التجريبية",[{k:"c",l:"للتأكيد اكتب: مسح"}],"مسح كل البيانات",{cls:"r",msg:"سيُحذف كل الطلبات والجرد والدفعات. لا يمكن التراجع."}); if(!f||f.c.trim()!=="مسح") return;
  if(await run(sb.rpc("reset_test_data"),"تم مسح البيانات")) refresh();
}

$("i_mail").innerHTML=ic("mail"); $("i_lock").innerHTML=ic("lock"); $("eye").innerHTML=ic("eye");
$("eye").onclick=()=>{ const p=$("pw"); p.type=p.type==="password"?"text":"password" };
$("pw").addEventListener("keydown",e=>{ if(e.key==="Enter") login() }); $("em").addEventListener("keydown",e=>{ if(e.key==="Enter") $("pw").focus() });
$("hav").innerHTML=ic("box"); $("rf").innerHTML=ic("refresh"); $("lo").innerHTML=ic("logout"); initNotifUI();
if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(()=>{});
boot();
</script>
</body>
</html>
