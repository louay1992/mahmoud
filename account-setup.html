<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#0f766e"><title>تفعيل الحساب الإداري</title><link rel="icon" href="/icons/admin-192.png"><link rel="stylesheet" href="/account-setup.css"><script src="/app-config.js" defer></script><script src="/vendor/supabase.js" defer></script><script src="/auth-session.js" defer></script><script src="/account-setup.js" defer></script></head><body>
<main class="setup-panel"><div class="setup-logo" aria-hidden="true">✉</div><span class="setup-kicker">الحساب الإداري</span><h1>تعيين كلمة المرور</h1><p id="setup-status" role="status" aria-live="polite">جارٍ التحقق من رابط البريد…</p><p id="setup-email" dir="ltr"></p>
<form id="setup-form" hidden><fieldset id="setup-fields"><label>كلمة المرور الجديدة<input id="setup-password" type="password" autocomplete="new-password" dir="ltr" minlength="8" maxlength="128" required></label><label>تأكيد كلمة المرور<input id="setup-confirm" type="password" autocomplete="new-password" dir="ltr" minlength="8" maxlength="128" required></label><small>استخدم 8 أحرف على الأقل.</small></fieldset><button id="setup-save" type="submit">حفظ كلمة المرور وتفعيل الحساب</button></form>
<button id="setup-cancel" class="secondary" type="button" hidden>إلغاء وتسجيل الخروج</button><a class="setup-back" href="/admin.html">العودة إلى دخول التطبيق الإداري</a></main></body></html>
